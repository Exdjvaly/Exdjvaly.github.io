    if (z === "tag") d.setDate(d.getDate() + r);
    else if (z === "woche") d.setDate(d.getDate() + 7 * r);
    else if (z === "monat") { d.setDate(1); d.setMonth(d.getMonth() + r); }
    else { d.setDate(1); d.setFullYear(d.getFullYear() + r); }
    this._bz.datum = isoTag(d);
    this._bzLaden();
  }

  _bzTitel(p) {
    const s = new Date(`${p.start}T12:00:00`), e = new Date(`${p.end}T12:00:00`);
    if (p.zeit === "tag") return s.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
    if (p.zeit === "woche") return `${s.getDate()}.${s.getMonth() + 1}. – ${e.getDate()}.${e.getMonth() + 1}.${e.getFullYear()}`;
    if (p.zeit === "monat") return `${MONATE[s.getMonth()]} ${s.getFullYear()}`;
    return String(s.getFullYear());
  }

  _bzName(p, t, lang = false) {
    if (p.zeit === "tag") return lang ? `${t.name}:00 Uhr` : t.name;
    if (p.zeit === "jahr") return lang ? MONATE[Number(t.name) - 1] : MONATE[Number(t.name) - 1].slice(0, 3);
    const d = new Date(`${t.name}T12:00:00`);
    if (p.zeit === "woche") return lang ? d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "numeric" }) : WOCHENTAG[(d.getDay() + 6) % 7];
    return lang ? d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "long" }) : String(d.getDate());
  }

  _bzDiagramm(p) {
    const teile = p.teile || [], n = teile.length;
    const ohne = (t) => t.ohne_solar ?? t.ohne_pv ?? 0, bez = (t) => t.bezahlt ?? t.kosten ?? 0;
    if (!n || !teile.some((t) => ohne(t) || bez(t) || t.erloes)) return `<div class="leerhinweis">Für diesen Zeitraum gibt es noch keine Daten. VOLTHERM zählt ab dem Tag der Einrichtung.</div>`;
    const W = 1000, T = 14, unten = 220, L = 54, R = 8;
    const maxV = Math.max(...teile.map((t) => Math.max(ohne(t), bez(t))), 0.01) * 1.1;
    const maxE = Math.max(...teile.map((t) => t.erloes || 0), 0.01);
    const y = (v) => unten - ((unten - T) * v) / maxV, eh = (v) => (34 * v) / maxE;
    const breite = (W - L - R) / n, bw = Math.max(4, breite * 0.64);
    const ticks = [0, maxV / 3, (2 * maxV) / 3].map((v) => `<line class="gitter" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" class="achse rechtsb">${zahl(v, v < 10 ? 1 : 0)} €</text>`).join("");
    const jede = n > 24 ? 3 : n > 12 ? 2 : 1;
    const saeulen = teile.map((t, i) => {
      const x = L + i * breite + (breite - bw) / 2, aktiv = this._bz.tip === i;
      return `<g data-akt="bztip|${i}" class="bzsaeule${aktiv ? " aktiv" : ""}">
        <rect x="${L + i * breite}" y="${T}" width="${breite}" height="${unten + 50 - T}" fill="transparent"/>
        <rect x="${x}" y="${y(ohne(t))}" width="${bw}" height="${unten - y(ohne(t))}" rx="3" fill="#343a46"/>
        <rect x="${x + bw * 0.18}" y="${y(bez(t))}" width="${bw * 0.64}" height="${unten - y(bez(t))}" rx="2" fill="${C.netz_bezug}"/>
        ${t.erloes ? `<rect x="${x + bw * 0.18}" y="${unten + 2}" width="${bw * 0.64}" height="${eh(t.erloes)}" rx="2" fill="${C.netz_einsp}" opacity=".85"/>` : ""}
        ${i % jede === 0 ? `<text x="${x + bw / 2}" y="${unten + 52}" class="achse">${this._bzName(p, t)}</text>` : ""}</g>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${unten + 58}" class="bzdiagramm" role="img" aria-label="Stromkosten je Zeitabschnitt">${ticks}<line class="gitter" x1="${L}" x2="${W - R}" y1="${unten}" y2="${unten}"/>${saeulen}</svg>`;
  }

  _seiteBilanz() {
    const p = this._bz.daten, z = this._bz.zeit, g = C.netz_einsp;
    const kopf = `<div class="bzkopf">${this._kopfModul(g, "bilanz", "Bilanz", p ? this._bzTitel(p) : "")}
      <div class="bzsteuer"><div class="wahl bzzeit" role="group" style="--f:#19C3E6">${[["tag", "Tag"], ["woche", "Woche"], ["monat", "Monat"], ["jahr", "Jahr"]].map(([w, t]) => `<button data-akt="bzzeit|${w}" aria-pressed="${z === w}">${t}</button>`).join("")}</div>
        <div class="blaettern"><button data-akt="bzweiter|-1" aria-label="früher" ${p && !p.frueher ? "disabled" : ""}>‹</button><button data-akt="bzweiter|1" aria-label="später" ${p && !p.spaeter ? "disabled" : ""}>›</button></div></div></div>`;
    if (!p) return `${kopf}<div class="leerhinweis">${esc(this._bz.fehler || "Lade …")}</div>`;
    const s = p.summe || {}, cfg = this._cfg.bilant || {};
    const verg = cfg.verguetung_ct ?? p.verguetung_ct, grund = cfg.grundgebuehr ?? p.grundgebuehr;
    const kpis = [["Gespart", eur(s.ersparnis), "gegenüber ohne Solaranlage", g, "haupt"], ["Bezahlt", eur(s.bezahlt), grund ? "Netzstrom + Grundgebühr" : "Netzstrom", C.netz_bezug],
      ["Ohne Solaranlage", eur(s.ohne_solar), "gleicher Verbrauch, alles aus dem Netz", "var(--mut)"],
      ["Einspeisung", eur(s.erloes), `${kwhT(s.einspeisung)} ins Netz`, g], ["Autarkie", s.autarkie == null ? "–" : `${s.autarkie} %`, "vom Verbrauch selbst erzeugt", C.pv]];
    const tipT = this._bz.tip != null ? p.teile?.[this._bz.tip] : null;
    const tip = tipT ? `<b>${esc(this._bzName(p, tipT, true))}</b> · bezahlt <b>${eur(tipT.bezahlt ?? tipT.kosten)}</b> · ohne Solaranlage ${eur(tipT.ohne_solar ?? tipT.ohne_pv)} · Einspeisung ${eur(tipT.erloes)}`
      : "Tippen Sie auf einen Balken für Details.";
    const proKwh = s.verbraucht > 0.1 ? `${zahl((s.netto / s.verbraucht) * 100, 1)} ct je verbrauchter kWh` : "";
    const rechnung = `<div class="zeilen">
        <div><span>Netzstrom (${kwhT(s.bezug)})</span><b>${eur(s.kosten)}</b></div>
        ${grund ? `<div><span>Grundgebühr</span><b>${eur(s.grund)}</b></div>` : ""}
        <div><span>Abzüglich Einspeisevergütung</span><b style="color:${g}">− ${eur(s.erloes)}</b></div>
        <div class="summe"><span><b>Unterm Strich</b></span><b class="gross-zahl">${eur(s.netto)}</b></div></div>
      <p class="bzschnitt">${s.tage > 1 ? `Durchschnitt <b>${eur(s.netto / s.tage)}</b> pro Tag` : ""}${s.tage > 1 && proKwh ? " · " : ""}${proKwh}</p>
      <div class="zwei bzsatz">
        ${this._feld("Einspeisevergütung", this._stepper("bilant.verguetung_ct", verg, "ct/kWh", 0.1, 0, 50, 1))}
        ${this._feld("Grundgebühr", this._stepper("bilant.grundgebuehr", grund, "€/Monat", 0.5, 0, 100, 2))}</div>`;
    const andere = (s.wallbox || 0) + (s.pompa || 0) + (s.heizstab || 0);
    const verbr = [["Haus", Math.max(0, (s.verbraucht || 0) - andere), C.haus], ["Wallbox", s.wallbox, C.wallbox], ["Wärmepumpe", s.pompa, C.wp], ["Warmwasser", s.heizstab, C.heizstab]].filter((v) => (v[1] || 0) > 0.05);
    const vmax = Math.max(...verbr.map((v) => v[1]), 0.01), jeKwh = s.verbraucht > 0.1 ? (s.bezahlt || 0) / s.verbraucht : 0;
    const verbraucher = verbr.length ? verbr.map(([t, k, f]) => `<div class="vz" style="--f:${f}"><span>${t}</span><div class="spur2"><i style="width:${(k / vmax) * 100}%"></i></div><em>${kwhT(k)} · ${eur(k * jeKwh)}</em></div>`).join("") : '<div class="leerhinweis">Noch keine Daten.</div>';
    const energie = `<div class="zeilen">
        <div><span>Erzeugt (Photovoltaik)</span><b style="color:${C.pv}">${kwhT(s.erzeugt)}</b></div>
        <div><span>Verbraucht</span><b>${kwhT(s.verbraucht)}</b></div>
        <div><span>Aus dem Netz</span><b style="color:${C.netz_bezug}">${kwhT(s.bezug)}</b></div>
        <div><span>Ins Netz eingespeist</span><b style="color:${g}">${kwhT(s.einspeisung)}</b></div>
        <div class="summe"><span>Eigenverbrauch der Sonnenenergie</span><b>${s.eigenverbrauch == null ? "–" : `${s.eigenverbrauch} %`}</b></div>
        <div><span>CO₂ vermieden</span><b>${zahl(s.co2_kg || 0, 0)} kg</b></div></div>`;
    const taten = [];
    if (s.wallbox > 0.5) taten.push([C.wallbox, kwhT(s.wallbox), `Das Auto ${s.wb_tage > 1 ? `an ${s.wb_tage} Tagen ` : ""}geladen, davon ${Math.round((100 * (s.wb_sonne || 0)) / s.wallbox)} % mit eigenem Strom.`]);
    if (s.bat_entladen > 0.5) taten.push([C.batterie, eur(s.bat_wert), `Der Speicher hat ${kwhT(s.bat_entladen)} Netzstrom ersetzt.`]);
    if (s.hz_sonne > 0.5) taten.push([C.heizstab, kwhT(s.hz_sonne), `Warmwasser mit Sonnenstrom statt Einspeisung${verg ? ` für ${zahl(verg, 1)} ct` : ""}.`]);
    taten.push([g, eur(s.ersparnis), "Insgesamt gespart in diesem Zeitraum."]);
    return `${kopf}
      <div class="bzseite">
        <section class="bzkpis">${kpis.map(([t, v, u, f, k]) => `<div class="karte kpi ${k || ""}" style="--f:${f}"><span>${t}</span><b>${v}</b><span>${u}</span></div>`).join("")}</section>
        <div class="bzraster">
          <section class="karte"><div class="kopf"><span class="etikett">${z === "tag" ? "Stromkosten je Stunde" : z === "jahr" ? "Stromkosten je Monat" : "Stromkosten je Tag"}</span>
            <span class="mini"><i class="lg" style="background:#343a46"></i>ohne Solaranlage<i class="lg" style="background:${C.netz_bezug}"></i>bezahlt<i class="lg" style="background:${g}"></i>Einspeisung</span></div>
            ${this._bzDiagramm(p)}<div class="bztip">${tip}</div></section>
          <section class="karte"><div class="kopf"><span class="etikett">Ihre Stromrechnung</span></div>${rechnung}</section>
        </div>
        <div class="bzraster">
          <section class="karte"><div class="kopf"><span class="etikett">Wofür der Strom gebraucht wurde</span><span class="mini">kWh · anteilige Kosten</span></div><div class="verbraucher">${verbraucher}</div></section>
          <section class="karte"><div class="kopf"><span class="etikett">Energie</span></div>${energie}</section>
        </div>
        <section class="karte"><div class="kopf"><span class="etikett">Was VOLTHERM für Sie getan hat</span></div>
          <div class="taten">${taten.map(([f, v, t]) => `<div class="tat" style="--f:${f}"><b>${v}</b><span>${t}</span></div>`).join("")}</div></section>
        ${this._praesKarte()}
        ${this._fernKarte()}
        ${this._uhrKarte()}
      </div>`;
  }

  _render() {
    if (!this._hass || this._praes) return;  // prezentarea e deschisă: nu redesenăm, altfel iframe-ul ar porni de la capăt
    const seiten = this._seiten();
    if (!seiten.some(([id]) => id === this._seite)) this._seite = seiten[0][0];
    const preis = this._n("vt_pret_curent");
    const jetzt = new Date();
    const inhalt = { energie: () => this._seiteEnergie(), pv: () => this._seitePv(), batterie: () => this._seiteBatterie(),
      wallbox: () => this._seiteWallbox(), heizstab: () => this._seiteHeizstab(), klima: () => this._seiteKlima(), wp: () => this._seiteWp(),
      bilanz: () => this._seiteBilanz() }[this._seite]();
    const handy = istHandy();
    const haupt = this._handyHaupt(seiten);
    const navSeiten = handy ? seiten.filter(([id]) => haupt.includes(id)) : seiten;
    const mehr = handy ? seiten.filter(([id]) => !haupt.includes(id)) : [];
    const sich = this._sicherheit();
    const pauseKnopf = sich && sich.stare !== "pausiert" && !this._pauseFrage
      ? `<button class="pauseknopf" data-akt="pause|frage" title="Alle Geräte normal laufen lassen">${ico("pause", "currentColor", 16)}<span>Pausieren</span></button>` : "";
    const alt = this.shadowRoot.querySelector("main");
    const scroll = alt?.dataset.seite === this._seite ? alt.scrollTop : 0;
    this.shadowRoot.innerHTML = `<style>${CSS}</style>
      <div class="seite">
        <header>
          ${this._schmal ? `<button class="menue" data-akt="menue" aria-label="Menü">☰</button>` : ""}
          ${this._fehler ? `<span class="fehlerzeile">${esc(this._fehler)}</span>` : ""}
          <div class="marke"><svg viewBox="0 0 300 300" class="logo" aria-hidden="true"><polygon points="22,20 86,20 166,232 150,272" fill="#8FA3C8"/><polygon points="74,20 112,20 168,200 154,226" fill="#FFFFFF"/><polygon points="200,20 290,20 214,118 276,118 126,286 176,170 128,170" fill="#19C3E6"/></svg>
            <span>VOLT<b>HERM</b></span></div>
          <div class="datum">${jetzt.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })}</div>
          <div class="rechts">
            ${preis != null ? `<span class="preis"><small>Preis jetzt</small>${zahl(preis * 100)} ct</span>` : ""}
            ${pauseKnopf}
            <span class="uhr">${jetzt.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}</span></div>
        </header>
        <main data-seite="${this._seite}">${inhalt}</main>
        ${this._sicherHtml()}
        ${this._updateHtml()}
        ${handy ? this._mehrHtml(seiten) : ""}
        <nav aria-label="Bereiche">${navSeiten.map(([id, t, f]) => `<button data-akt="seite|${id}" aria-current="${id === this._seite}" style="--f:${f}">${ico(id, "currentColor", 22)}<span>${t}</span></button>`).join("")}
          ${handy ? (mehr.length ? `<button data-akt="mehr" aria-expanded="${!!this._mehr}" aria-current="${mehr.some(([id]) => id === this._seite)}" style="--f:#19C3E6">${ico("mehr", "currentColor", 22)}<span>Mehr</span></button>` : "")
          : `<button class="rund" data-akt="rundlauf" aria-pressed="${this._rundlauf}" title="Seiten automatisch wechseln, z. B. am Fernseher">${ico("rund", "currentColor", 22)}<span>${this._rundlauf ? "Rundlauf an" : "Rundlauf"}</span></button>`}</nav>
        ${this._rundlauf && !handy ? `<div class="rundbalken" style="--d:${RUNDLAUF_S}s" aria-hidden="true"><i></i></div>` : ""}
        ${this._ansageHtml()}
        ${this._hinweisHtml()}
      </div>`;
    const m = this.shadowRoot.querySelector("main");
    if (m) m.scrollTop = scroll;
    this._szeneEinpassen();
  }
}

</script>
<script type="module">

const p2 = (n) => String(n).padStart(2, "0");
const isoOra = (d) => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + "T" + p2(d.getHours()) + ":00";
const isoTag = (d) => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const rund = (v, n) => Math.round(v * Math.pow(10, n)) / Math.pow(10, n);
const zufall = (s) => { const x = Math.sin(s * 12.9898) * 43758.5453; return x - Math.floor(x); };

// Preț pe oră (EUR/kWh): noaptea ieftin, dimineața și seara scump, plus o abatere mică pe zi.
const PREIS_STUNDE = [0.19, 0.18, 0.17, 0.17, 0.18, 0.21, 0.26, 0.31, 0.33, 0.29, 0.25, 0.22,
  0.20, 0.19, 0.20, 0.23, 0.28, 0.34, 0.38, 0.36, 0.31, 0.27, 0.23, 0.21];
const preis = (d) => rund(PREIS_STUNDE[d.getHours()] * (0.92 + 0.16 * zufall(d.getDate() * 24 + d.getHours())), 4);

function preisliste(n) {
  const l = [], a = new Date();
  a.setMinutes(0, 0, 0);
  for (let i = 0; i < n; i++) { const d = new Date(a.getTime() + i * 3600000); l.push({ ora: isoOra(d), pret: preis(d) }); }
  return l;
}

// Prognoza PV de azi, pe oră (W): clopot peste zi, normalizat la kWh-ul prognozat.
const PROGNOSE_HEUTE = 35.2, PROGNOSE_MORGEN = 28.6;
function prognoza() {
  const forma = [], ore = [], a = new Date();
  for (let h = 5; h <= 21; h++) { const x = (h - 13) / 3; forma.push(Math.exp(-x * x)); ore.push(h); }
  const summe = forma.reduce((x, y) => x + y, 0);
  return ore.map((h, i) => ({ ora: isoOra(new Date(a.getFullYear(), a.getMonth(), a.getDate(), h)),
    w: Math.round((forma[i] / summe) * PROGNOSE_HEUTE * 1000) }));
}

// ---------- Bilanț: zile inventate, de la instalare (acum 420 de zile) până azi ----------
const CAMPURI = ["erzeugt", "verbraucht", "bezug", "einspeisung", "wallbox", "wb_sonne", "heizstab", "hz_sonne", "pompa",
  "bat_entladen", "kosten", "ohne_pv", "erloes", "bat_wert"];
const INSTALLIERT = new Date(Date.now() - 420 * 86400000);
const VERGUETUNG_CT = 8.2, GRUNDGEBUEHR = 12.9;

const zileLuna = (j, m) => new Date(j, m + 1, 0).getDate();

// Ziua de azi e o zi însorită de arătat: valori fixe, ca restul ecranului să se potrivească.
const TAG_HEUTE = { erzeugt: 33.8, verbraucht: 28.2, bezug: 4.0, einspeisung: 9.6, wallbox: 11.4, wb_sonne: 8.0,
  heizstab: 4.2, hz_sonne: 3.6, pompa: 3.6, bat_entladen: 6.4, kosten: 1.06, ohne_pv: 8.52, erloes: 0.79, bat_wert: 1.86 };

function zi(d) {
  if (isoTag(d) === isoTag(new Date())) return { ...TAG_HEUTE };
  const n = Math.round(d.getTime() / 86400000);
  const r = (k) => zufall(n + k * 0.137);
  const tag = (d - new Date(d.getFullYear(), 0, 0)) / 86400000;
  const sonne = 0.32 + 0.68 * (0.5 + 0.5 * Math.cos(((tag - 172) / 365) * 2 * Math.PI));  // maxim la solstițiu
  const winter = sonne < 0.6;
  const erzeugt = 30 * sonne * (0.5 + 0.7 * r(1));
  const haus = 7.5 + 3.5 * r(2);
  const wallbox = r(3) > 0.45 ? 9 + 12 * r(4) : 0;
  const heizstab = (winter ? 3.2 : 1.8) + 2.5 * r(5);
  const pompa = (winter ? 7 : 1.5) + 4 * r(6);
  const verbraucht = haus + wallbox + heizstab + pompa;
  const eigen = Math.min(erzeugt * 0.72, verbraucht * 0.86);  // cu acumulatorul, mare parte din soare rămâne în casă
  const z = {
    erzeugt: erzeugt, verbraucht: verbraucht, bezug: verbraucht - eigen, einspeisung: erzeugt - eigen,
    wallbox: wallbox, wb_sonne: wallbox * (0.45 + 0.4 * r(7)), heizstab: heizstab, hz_sonne: heizstab * 0.85,
    pompa: pompa, bat_entladen: 3.4 + 3.6 * r(8),
  };
  z.kosten = z.bezug * 0.265;
  z.ohne_pv = z.verbraucht * 0.302;
  z.erloes = z.einspeisung * (VERGUETUNG_CT / 100);
  z.bat_wert = z.bat_entladen * 0.29;
  return z;
}

// Profilul zilei pe ore: consumul casei și soarele.
const FORMA = [0.5, 0.5, 0.6, 0.6, 0.5, 0.7, 1.4, 1.6, 1.2, 0.8, 0.5, 0.4, 0.4, 0.4, 0.5, 0.8, 1.4, 1.8, 1.9, 1.6, 1.2, 0.9, 0.7, 0.6];
const SOLAR = [0, 0, 0, 0, 0, .1, .4, .9, 1.4, 1.8, 2.1, 2.3, 2.4, 2.3, 2.1, 1.7, 1.2, .7, .3, .05, 0, 0, 0, 0];

// Cât din ziua de azi s-a scurs, după profilul dat (0…1).
function anteil(shape) {
  const a = new Date(), ganz = shape.reduce((x, y) => x + y, 0);
  let s = 0;
  for (let h = 0; h < a.getHours(); h++) s += shape[h];
  return Math.min(1, (s + shape[a.getHours()] * (a.getMinutes() / 60)) / ganz);
}

// Costurile pe oră ale unei zile (ecranul „Tag”): profilul consumului peste suma zilei.
function oreZi(d, pana) {
  const z = zi(d), teil = [], forma = FORMA, solar = SOLAR;
  const sf = forma.reduce((a, b) => a + b, 0), ss = solar.reduce((a, b) => a + b, 0);
  for (let h = 0; h < 24; h++) {
    if (pana != null && h > pana) { teil.push({ name: p2(h), kosten: 0, ohne_pv: 0, erloes: 0 }); continue; }
    teil.push({ name: p2(h), kosten: rund((z.kosten * forma[h]) / sf, 3), ohne_pv: rund((z.ohne_pv * forma[h]) / sf, 3),
      erloes: rund((z.erloes * solar[h]) / ss, 3) });
  }
  return teil;
}

function rotunjeste(z, grund) {
  const r = {};
  for (const k of CAMPURI) r[k] = rund(z[k] || 0, ["kosten", "ohne_pv", "erloes", "bat_wert"].includes(k) ? 3 : 2);
  r.grund = rund(grund, 3);
  r.bezahlt = rund((z.kosten || 0) + grund, 2);
  r.ohne_solar = rund((z.ohne_pv || 0) + grund, 2);
  r.netto = rund(r.bezahlt - (z.erloes || 0), 2);
  r.ersparnis = rund((z.ohne_pv || 0) - (z.kosten || 0) + (z.erloes || 0), 2);
  r.autarkie = (z.verbraucht || 0) > 0.05 ? Math.round(Math.max(0, 1 - z.bezug / z.verbraucht) * 100) : null;
  r.eigenverbrauch = (z.erzeugt || 0) > 0.05 ? Math.round(Math.max(0, 1 - z.einspeisung / z.erzeugt) * 100) : null;
  r.co2_kg = Math.round(Math.max(0, (z.verbraucht || 0) - (z.bezug || 0)) * 0.38);
  return r;
}

function aduna(zile) {
  const t = {};
  for (const k of CAMPURI) t[k] = 0;
  for (const z of zile) for (const k of CAMPURI) t[k] += z[k] || 0;
  return t;
}

// Ziua de azi, cât s-a adunat până acum: soarele după profilul PV, restul după profilul consumului.
const SOLARE = ["erzeugt", "einspeisung", "erloes", "wb_sonne", "hz_sonne"];
const heute = () => {
  const a = new Date(), fs = anteil(SOLAR), fv = anteil(FORMA), z = {};
  for (const k of CAMPURI) z[k] = (TAG_HEUTE[k] || 0) * (SOLARE.includes(k) ? fs : fv);
  return { datum: isoTag(a), ...rotunjeste(z, GRUNDGEBUEHR / zileLuna(a.getFullYear(), a.getMonth())) };
};

function bilanz(zeit, datum) {
  const azi = new Date(); azi.setHours(12, 0, 0, 0);
  const ref = new Date((datum || isoTag(azi)) + "T12:00:00");
  let start = new Date(ref), end = new Date(ref);
  if (zeit === "woche") { start.setDate(ref.getDate() - ((ref.getDay() + 6) % 7)); end = new Date(start); end.setDate(start.getDate() + 6); }
  else if (zeit === "monat") { start = new Date(ref.getFullYear(), ref.getMonth(), 1, 12); end = new Date(ref.getFullYear(), ref.getMonth(), zileLuna(ref.getFullYear(), ref.getMonth()), 12); }
  else if (zeit === "jahr") { start = new Date(ref.getFullYear(), 0, 1, 12); end = new Date(ref.getFullYear(), 11, 31, 12); }

  const hat = (d) => d >= INSTALLIERT && d <= azi;
  const grundZi = (d) => GRUNDGEBUEHR / zileLuna(d.getFullYear(), d.getMonth());
  const zile = [];
  let grund = 0;
  for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    if (!hat(d)) continue;
    const istAzi = isoTag(d) === isoTag(azi);
    zile.push([new Date(d), istAzi ? heute() : zi(d)]);
    grund += grundZi(d);
  }
  const summe = rotunjeste(aduna(zile.map((x) => x[1])), grund);
  summe.tage = zile.length;
  summe.wb_tage = zile.filter((x) => (x[1].wallbox || 0) > 0.5).length;

  let teile = [];
  if (zeit === "tag") {
    teile = hat(ref) ? oreZi(ref, isoTag(ref) === isoTag(azi) ? new Date().getHours() : null) : [];
  } else if (zeit === "jahr") {
    for (let m = 0; m < 12; m++) {
      const dinLuna = zile.filter((x) => x[0].getMonth() === m);
      teile.push(dinLuna.length
        ? { name: String(m + 1), ...rotunjeste(aduna(dinLuna.map((x) => x[1])), dinLuna.reduce((s, x) => s + grundZi(x[0]), 0)) }
        : { name: String(m + 1) });
    }
  } else {
    const peZi = new Map(zile.map((x) => [isoTag(x[0]), x[1]]));
    for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const z = peZi.get(isoTag(d));
      teile.push(z ? { name: isoTag(d), ...rotunjeste(z, grundZi(d)) } : { name: isoTag(d) });
    }
  }
  return { zeit: zeit, start: isoTag(start), end: isoTag(end), summe: summe, teile: teile,
    frueher: INSTALLIERT < start, spaeter: end < azi,
    verguetung_ct: cfg.bilant.verguetung_ct, grundgebuehr: cfg.bilant.grundgebuehr };
}

// Data ultimei protecții anti-legionela, ca în backend: „zz.ll., hh:mm”.
function legionellaText() {
  const d = new Date(Date.now() - 2 * 86400000);
  return p2(d.getDate()) + "." + p2(d.getMonth() + 1) + "., 13:20";
}

// ---------- Setările modulelor (răspunsul la voltherm/home) ----------
const cfg = {
  baterie: { capacitate: 10.24, soc_minim: 15, prag_incarcare_ct: 19, prag_descarcare_ct: 24 },
  wallbox: { puncte: { "1": { mod: "auto", plecare: "07:00", soc_tinta: 80, pret_max: 26, peste_prag: "incarca" } }, demo: false },
  heizstab: { temp_min: 45, temp_max: 62, prag_pret_ct: 18, boost_pana: null, boost_moeglich: true, temp_sigura: true, legionella_letzt: legionellaText() },
  clima: { camere: {
    "climate.wohnzimmer": { nume: "Wohnzimmer", mod: "auto", confort_iarna: 21.5, confort_vara: 25 },
    "climate.schlafzimmer": { nume: "Schlafzimmer", mod: "confort", confort_iarna: 19, confort_vara: 24 } } },
  pompa: { blocare_ct: 40, blocare_max_h: 2, surplus_recomandat: 1500, semnal_14a: "binary_sensor.vt_demo_14a" },
  fern: { erlaubt: true, installiert: true, verbindungen: [{ t: new Date(Date.now() - 3 * 86400000 - 7200000).toISOString(), wer: "VOLTHERM Service" }] },
  systempflege: { stufe: "ok", text: "alles aktuell" },
  pv: { prognose_heute_kwh: PROGNOSE_HEUTE, morgen_kwh: PROGNOSE_MORGEN, quelle: "Forecast.Solar", prognoza: prognoza(), heute_kwh: 0 },
  sicherheit: { stare: "normal", pauza_pana: null, text: null, module: [] },
  bilant: { verguetung_ct: VERGUETUNG_CT, grundgebuehr: GRUNDGEBUEHR },
  heute: heute(),
};
cfg.pv.heute_kwh = cfg.heute.erzeugt;

// ---------- Senzorii vt_* ----------
const boostAktiv = () => !!cfg.heizstab.boost_pana && new Date(cfg.heizstab.boost_pana) > new Date();
const ansageZeit = new Date(Date.now() - 45000).toISOString();  // banda de sus se stinge singură după 60 s
const basis = { pv: 6400, consum: 5400, wallbox: 2900, heizstab: 1200, pompa: 480, soc: 70.4, temp: 52.4, bat: -500 };
const jetzt = { ...basis };

const st = (id, wert, attr) => [id.includes(".") ? id : "sensor." + id,
  { entity_id: id.includes(".") ? id : "sensor." + id, state: wert == null ? "unknown" : String(wert),
    attributes: attr || {}, last_changed: new Date().toISOString() }];

function states() {
  const j = jetzt, netz = j.consum - j.pv - j.bat;  // minus = Einspeisung
  const preiseJetzt = preisliste(48), pJetzt = preiseJetzt[0].pret;
  const planOre = [...preiseJetzt.slice(0, 24)].sort((a, b) => a.pret - b.pret).slice(0, 3).map((x) => x.ora).sort();
  const soc = Math.round(j.soc * 10) / 10;
  const kamer = (eid, temp, hvac, titlu, motiv) => ({ nume: cfg.clima.camere[eid].nume, entitate: eid, temp_ext: 8.4,
    temp_ext_ok: true, hold_pana: null, decizie: { hvac: hvac, temp: temp + 1.5, titlu: titlu, motiv: motiv } });
  return Object.fromEntries([
    st("vt_pv_putere", Math.round(j.pv), { unit_of_measurement: "W", friendly_name: "vt_pv_putere" }),
    st("vt_retea_putere", Math.round(netz), { unit_of_measurement: "W" }),
    st("vt_baterie_putere", Math.round(j.bat), { unit_of_measurement: "W" }),
    st("vt_baterie_soc", soc, { unit_of_measurement: "%" }),
    st("vt_baterie_energie", rund((soc / 100) * cfg.baterie.capacitate, 2), { unit_of_measurement: "kWh" }),
    st("vt_consum_casa", Math.round(j.consum), { unit_of_measurement: "W" }),
    st("vt_pret_curent", pJetzt, { unit_of_measurement: "EUR/kWh", furnizor: "Tibber", preturi: preiseJetzt, eroare: null }),
    st("vt_wallbox_putere", Math.round(j.wallbox), { unit_of_measurement: "W" }),
    st("vt_wallbox_decizie", "pv", { comanda: "activ", puncte: [{ id: "1", titlu: "Garage", conectat: true, incarca: true,
      putere: Math.round(j.wallbox), mod_evcc: "pv", masina: "VW ID.4", soc: 62, capacitate: 77, putere_max: 11040,
      decizie: { mod: "pv", motiv: "Das Auto hat 62 %, Ziel 80 %: Ich lade mit dem PV-Überschuss und nachts in den günstigsten Stunden." } }] }),
    st("vt_heizstab_putere", Math.round(j.heizstab), { unit_of_measurement: "W" }),
    st("vt_heizstab_temperatura", rund(j.temp, 1), { unit_of_measurement: "°C" }),
    st("vt_heizstab_decizie", Math.round(j.heizstab), boostAktiv()
      ? { mod: "boost", comanda: "activ", motiv: "Sie haben „Warmes Wasser sofort“ gewählt: Der Heizstab heizt, bis die Stunde um ist." }
      : { mod: "surplus", comanda: "activ",
        motiv: "PV-Überschuss 1400 W, Speicher " + rund(j.temp, 1).toLocaleString("de-DE") + " °C unter 62 °C." }),
    st("vt_plan_baterie", planOre.length, { ore: planOre, pret_max: 0.183, pret_absolut_max: 0.25, soc: soc,
      ore_necesare: planOre.length, energie: 4.6, motiv: "Morgen reicht die Sonne nicht ganz: " + planOre.length + " günstige Nachtstunden eingeplant.",
      planificat_la: new Date().toISOString() }),
    st("vt_baterie_decizie", "SOLAR_SMALL", { prioritate: "P5", comanda: "activ", pret: pJetzt, soc: soc, surplus: 1400,
      actiune: "aus PV laden", motiv: "PV-Überschuss 1,4 kW: Batterie und Heizstab laufen mit Sonnenstrom." }),
    st("vt_pompa_decizie", 3, { titlu: "Empfohlen", comanda: "activ", putere: Math.round(j.pompa), stare_relee: [false, true],
      blocat_azi_min: 25, motiv: "PV-Überschuss 1,4 kW: Die Wärmepumpe speichert die Sonne als Wärme und heizt etwas wärmer." }),
    st("vt_clima_decizie", 1, { temp_ext: 8.4, surplus: 1400, comanda: "activ", camere: [
      kamer("climate.wohnzimmer", 21.5, "heat", "Heizen 23 °C", "PV-Überschuss 1,4 kW: Komfort 21,5 °C + 1,5 °C, um Energie im Raum zu speichern."),
      kamer("climate.schlafzimmer", 19, "off", "Aus", "Im Schlafzimmer sind 19,4 °C: Heizen ist gerade nicht nötig.")] }),
    st("vt_heute", cfg.heute.erzeugt, cfg.heute),
    st("vt_pv_prognose", cfg.pv.prognose_heute_kwh, { heute_kwh: cfg.pv.prognose_heute_kwh, morgen_kwh: cfg.pv.morgen_kwh, quelle: cfg.pv.quelle }),
    st("vt_sicherheit", cfg.sicherheit.stare, { module: {}, cauze: cfg.sicherheit.text ? [{ cheie: "pauza", text: cfg.sicherheit.text, module: [] }] : [],
      pauza_pana: cfg.sicherheit.pauza_pana, protokoll: [] }),
    st("vt_ansage", "Das Auto lädt mit Sonnenstrom: 62 %, fertig bis 07:00 Uhr.", { zeit: ansageZeit,
      eveniment: "auto_laedt", titlu: "Wallbox", stoerung: false, kanaele: ["handy"], still: false }),
    st("climate.wohnzimmer", "heat", { friendly_name: "Wohnzimmer", current_temperature: 21.8, temperature: 23 }),
    st("climate.schlafzimmer", "off", { friendly_name: "Schlafzimmer", current_temperature: 19.4, temperature: 19 }),
    st("binary_sensor.vt_demo_14a", "off", { friendly_name: "§14a-Signal" }),
    // Himmel der Energie-Karte: Demo zeigt immer einen sonnigen Mittag (passt zu den PV-Werten).
    st("sun.sun", "above_horizon", { elevation: 32, azimuth: 168 }),
    st("weather.forecast_home", "sunny", { friendly_name: "Zuhause" }),
  ]);
}

// ---------- hass fals ----------
function setze(pfad, wert) {
  const teile = pfad.split("."), letzt = teile.pop();
  let o = cfg;
  for (const k of teile) { if (o[k] == null) o[k] = {}; o = o[k]; }
  o[letzt] = wert;
}

// După o comandă, senzorii trebuie să arate imediat noua stare (ca la HA, prin state_changed).
const frisch = () => setTimeout(() => zeigen(), 30);

async function callWS(m) {
  await new Promise((ok) => setTimeout(ok, 90));  // o mică întârziere, ca la o instalație adevărată
  if (m.type === "voltherm/home") return JSON.parse(JSON.stringify({ ...cfg, heute: heute() }));
  if (m.type === "voltherm/bilanz") return bilanz(m.zeit, m.datum);
  if (m.type === "voltherm/home_seteaza") { setze(m.pfad, m.wert); frisch(); return { ok: true }; }
  if (m.type === "voltherm/home_boost") {
    cfg.heizstab.boost_pana = m.minute ? new Date(Date.now() + m.minute * 60000).toISOString() : null;
    jetzt.heizstab = m.minute ? 3000 : basis.heizstab;
    frisch();
    return { boost_pana: cfg.heizstab.boost_pana };
  }
  if (m.type === "voltherm/home_pause") {
    cfg.sicherheit = m.an ? { stare: "pausiert", pauza_pana: new Date(Date.now() + 86400000).toISOString(),
      text: "In der Demo pausiert.", module: [] } : { stare: "normal", pauza_pana: null, text: null, module: [] };
    frisch();
    return { pauza_pana: cfg.sicherheit.pauza_pana };
  }
  if (m.type === "voltherm/home_fern") { cfg.fern = { ...cfg.fern, erlaubt: m.erlaubt }; return cfg.fern; }
  throw new Error("In der Demo nicht verfügbar.");
}

const el = document.querySelector("voltherm-home");
// Ecranul își desenează „.seite” cu height:100vh; sub banda demo ar ieși bara de jos din imagine.
// La fiecare redesenare punem înapoi stilul nostru în shadow root.
const stil = () => {
  if (el.shadowRoot.querySelector("#demostil")) return;
  const s = document.createElement("style");
  s.id = "demostil";
  s.textContent = ".seite{height:calc(100vh - 40px - env(safe-area-inset-top))}";
  el.shadowRoot.appendChild(s);
};
new MutationObserver(stil).observe(el.shadowRoot, { childList: true });

const zeigen = () => { el.hass = { states: states(), callWS: callWS, language: "de" }; stil(); };
zeigen();
document.getElementById("status").classList.add("weg");

// Valorile se mișcă puțin la fiecare 4 secunde, ca să arate viu.
setInterval(() => {
  const w = (b, a) => Math.max(0, b + (Math.random() - 0.5) * a);
  jetzt.pv = w(basis.pv, 900);
  jetzt.consum = w(basis.consum, 500);
  jetzt.wallbox = w(basis.wallbox, 400);
  jetzt.pompa = w(basis.pompa, 160);
  jetzt.bat = -Math.max(50, 500 + (Math.random() - 0.5) * 400);
  jetzt.soc = Math.min(99.5, jetzt.soc + 0.1);
  if (!boostAktiv()) jetzt.heizstab = w(basis.heizstab, 300);  // ora de „Jetzt heizen“ s-a terminat
  jetzt.temp = Math.min(62, jetzt.temp + 0.05);
  cfg.heute = heute();
  cfg.pv.heute_kwh = cfg.heute.erzeugt;
  zeigen();
}, 4000);
