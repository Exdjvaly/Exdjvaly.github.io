<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c16">
<title>VOLTHERM Demo</title>
<link rel="icon" href="data:,">
<style>
  :root { --band: calc(40px + env(safe-area-inset-top)); }
  html, body { margin: 0; height: 100%; background: #070c16; color: #e6ebf5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #band { position: fixed; left: 0; right: 0; top: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-sizing: border-box; height: var(--band); padding: env(safe-area-inset-top) 14px 0;
    background: #0e1626; border-bottom: 1px solid #1c2a44; font-size: 13px; letter-spacing: .06em; color: #8fa3c8; }
  #band b { color: #19C3E6; font-weight: 700; }
  #band button { font: inherit; letter-spacing: 0; color: #070c16; background: #19C3E6; border: 0; border-radius: 9px;
    padding: 7px 16px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  voltherm-home { display: block; height: 100%; box-sizing: border-box;
    padding-top: var(--band); padding-bottom: env(safe-area-inset-bottom); }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #070c16; text-align: center; padding: 24px; box-sizing: border-box; z-index: 5; }
  #status.weg { display: none; }
  #status h1 { margin: 0; font-size: 28px; letter-spacing: 2px; } #status h1 span { color: #19C3E6; }
  #status p { margin: 0; color: #8fa3c8; max-width: 320px; line-height: 1.4; }
  .punkt { width: 10px; height: 10px; border-radius: 50%; background: #19C3E6; animation: puls 1.2s infinite ease-in-out; }
  @keyframes puls { 50% { opacity: .25; transform: scale(.7); } }
  #ende { display: none; }
</style>
</head>
<body>
<div id="band"><span><b>Demo</b> · Beispielwerte</span><button id="ende" type="button">Beenden</button></div>
<voltherm-home></voltherm-home>
<div id="status"><h1>VOLT<span>HERM</span></h1><div class="punkt"></div><p>Demo wird vorbereitet…</p></div>

// </szene-bilder>
// Haus-Szene: Koordinaten im Hausbild (1456 × 1088), auf 70 % verkleinert, damit die Schriften passen.
const SZ = 0.7;
const sz = ([x, y]) => [+(x * SZ).toFixed(1), +(y * SZ).toFixed(1)];
// Bild mit linker oberer Ecke (x, y) und Breite b im Hausbild.
const bild = (name, x, y, b, k = "") => {
  const [w, h] = BILD[name + "_g"] || [1, 1], [px, py] = sz([x, y]);
  return `<image href="${BILD[name] || ""}" x="${px}" y="${py}" width="${(b * SZ).toFixed(1)}" height="${((b * h * SZ) / w).toFixed(1)}" class="${k}"/>`;
};
// Wo im Hausbild was steht: x, y = linke obere Ecke, b = Breite, fuss = Bodenpunkt für die Linie.
const SZENE = {
  hub: [700, 760],
  geraet: {
    netz: { x: 8, y: 400, b: 182, fuss: [100, 712] },
    wb: { x: 285, y: 850, b: 360, fuss: [330, 930], glanz: 70 },
    bat: { x: 458, y: 655, b: 62, fuss: [489, 762] },
    kl: { x: 972, y: 548, b: 118, fuss: [1010, 668] },
    wp: { x: 1120, y: 640, b: 168, fuss: [1190, 790] },
    hz: { x: 1150, y: 620, b: 82, fuss: [1191, 765] },
    hzWp: { x: 1300, y: 620, b: 82, fuss: [1341, 765] },
  },
  marke: { haus: [610, 120], pv: [1080, 200], netz: [100, 300], bat: [390, 560], wb: [700, 1000], kl: [960, 470], wp: [1180, 900], hz: [1200, 520], hzWp: [1350, 520] },
  fenster: [[680, 690], [365, 455], [862, 640], [350, 770]],
};
const wertE = (w) => (w == null ? ["–", ""] : Math.abs(w) < 1000 ? [String(Math.round(Math.abs(w))), "W"] : [zahl(Math.abs(w) / 1000, 2), "kW"]);

class VolthermHome extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: "open" });
    this._seite = "energie";
    this._bz = { zeit: "monat", datum: isoTag(new Date()), daten: null, tip: null };
    try { this._rundlauf = localStorage.getItem("voltherm-rundlauf") === "1"; } catch { this._rundlauf = false; }
    try { this._updZu = localStorage.getItem("voltherm-update-zu"); } catch { this._updZu = null; }
    this._pauseBis = 0;
    this._cfg = {};
    this._uhr = setInterval(() => this._takt(), 1000);
    this.shadowRoot.addEventListener("click", (e) => this._klick(e));
    this.shadowRoot.addEventListener("input", (e) => this._eingabe(e));
    this.shadowRoot.addEventListener("change", (e) => this._eingabe(e, true));
    this.shadowRoot.addEventListener("pointerdown", () => this._beruehrt());
  }

  disconnectedCallback() {
    clearInterval(this._uhr);
    clearInterval(this._ladeTimer);
  }

  set hass(hass) {
    const erstes = !this._hass;
    this._hass = hass;
    if (erstes && !this._extern && hass.callWS) {
      this._laden();
      this._ladeTimer = setInterval(() => this._laden(), 60000);
    }
    if (Date.now() > (this._ruhe || 0)) this._render();
  }

  // Einstellungen der Module (wallbox, heizstab, clima, pompa, baterie, pv). Von außen gesetzt = Vorschau ohne HA.
  set daten(d) {
    this._extern = true;
    this._cfg = structuredClone(d || {});
    this._render();
  }

  set panel(_p) {}

  set narrow(n) {
    this._schmal = n;
  }

  async _laden() {
    try {
      this._cfg = await this._hass.callWS({ type: "voltherm/home" });
      this._fehler = null;
      if (this._seite === "bilanz") this._bzLaden();
    } catch (err) {
      this._fehler = err.message || "VOLTHERM antwortet nicht.";
    }
    if (Date.now() > (this._ruhe || 0)) this._render();
  }

  async _senden(nachricht) {
    if (this._extern) return true;
    try {
      const r = await this._hass.callWS(nachricht);
      return r || true;
    } catch (err) {
      this._hinweis = { zeit: Date.now(), text: err.message || "Nicht gespeichert.", fehler: true };
      await this._laden();
      return false;
    }
  }

  _s(id) {
    return this._hass?.states[id.includes(".") ? id : `sensor.${id}`];
  }

  _n(id) {
    const s = this._s(id);
    const v = s ? Number(s.state) : NaN;
    return Number.isFinite(v) ? v : null;
  }

  _takt() {
    const el = this.shadowRoot.querySelector(".uhr");
    if (el) el.textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    if (this._rundlauf && !this._praes && !istHandy() && Date.now() > this._pauseBis && Date.now() - (this._gewechselt || 0) > RUNDLAUF_S * 1000) {
      const sichtbar = this._seiten().map(([id]) => id);
      this._seite = sichtbar[(sichtbar.indexOf(this._seite) + 1) % sichtbar.length];
      this._gewechselt = Date.now();
      if (this._seite === "bilanz") this._bzLaden();
      this._render();
    }
  }

  _beruehrt() {
    this._pauseBis = Date.now() + PAUSE_S * 1000;  // im Rundlauf: eine Berührung hält die Seite 60 s an
  }

  // Nur Seiten zeigen, deren Gerät es gibt.
  _seiten() {
    const zaehler = ["vt_pv_putere", "vt_retea_putere", "vt_baterie_putere"].some((e) => this._n(e) != null);
    const da = { energie: zaehler, pv: this._n("vt_pv_putere") != null, batterie: this._n("vt_baterie_soc") != null,
      wallbox: !!this._s("vt_wallbox_decizie"), heizstab: !!this._s("vt_heizstab_decizie"),
      klima: !!this._s("vt_clima_decizie")?.attributes?.camere?.length, wp: !!this._s("vt_pompa_decizie"),
      bilanz: !!(this._s("vt_heute") || this._cfg.heute || (this._extern && window.VOLTHERM_BILANZ)) };
    // Die Haus-Szene lohnt sich, sobald es Zähler oder ein gesteuertes Gerät gibt (auch nur Klima oder nur Wärmepumpe).
    da.energie = zaehler || da.wallbox || da.heizstab || da.klima || da.wp;
    const sichtbar = SEITEN.filter(([id]) => da[id]);
    return sichtbar.length ? sichtbar : SEITEN.filter(([id]) => id === "energie");
  }

  // Handy: bis zu 4 Seiten unten, die wichtigsten zuerst; der Rest unter „Mehr“.
  _handyHaupt(seiten) {
    const ids = seiten.map(([id]) => id);
    return [...HANDY_HAUPT.filter((id) => ids.includes(id)), ...ids.filter((id) => !HANDY_HAUPT.includes(id))].slice(0, 4);
  }

  _klick(e) {
    const el = e.target.closest("[data-akt]");
    if (!el) return;
    const [akt, a, b] = el.dataset.akt.split("|");
    if (akt === "seite") { this._seite = a; this._mehr = false; this._gewechselt = Date.now(); if (a === "bilanz") this._bzLaden(); }
    else if (akt === "bzzeit") { this._bz.zeit = a; this._bzLaden(); }
    else if (akt === "bzweiter") { this._bzSchieben(Number(a)); }
    else if (akt === "bztip") { this._bz.tip = Number(a); }
    else if (akt === "ansagezu") { this._ansageZu = el.dataset.akt.slice("ansagezu|".length); }
    else if (akt === "mehr") { this._mehr = !this._mehr; }
    else if (akt === "pause") { this._pauseFrage = a === "frage"; if (a === "an" || a === "aus") this._pausieren(a === "an"); }
    else if (akt === "fern") { this._fern(a === "an"); return; }
    else if (akt === "upd") { this._update(a); return; }
    else if (akt === "praes") { this._praesentation(a === "zu" ? null : a); return; }
    else if (akt === "sicherzu") { this._sicherZu = el.dataset.akt.slice("sicherzu|".length); }
    else if (akt === "rundlauf") {
      this._rundlauf = !this._rundlauf; this._gewechselt = Date.now(); this._pauseBis = 0;
      try { localStorage.setItem("voltherm-rundlauf", this._rundlauf ? "1" : "0"); } catch { /* Vorschau ohne Speicher */ }
    } else if (akt === "menue") this.dispatchEvent(new Event("hass-toggle-menu", { bubbles: true, composed: true }));
    else if (akt === "setze") this._setze(a, el.dataset.wert === "null" ? null : isNaN(el.dataset.wert) ? el.dataset.wert : Number(el.dataset.wert));
    else if (akt === "schritt") {
      const alt = Number(this._hole(a) ?? el.dataset.start);
      this._setze(a, Math.min(Number(el.dataset.max), Math.max(Number(el.dataset.min), Math.round((alt + Number(b)) * 10) / 10)));
    } else if (akt === "zeit") {
      const [h, m] = String(this._hole(a) || "07:00").split(":").map(Number);
      const t = (h * 60 + m + Number(b) + 1440) % 1440;
      this._setze(a, `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`);
    } else if (akt === "boost") this._boostUmschalten();
    this._render();
  }

  _eingabe(e, fertig = false) {
    const el = e.target;
    if (!el.dataset?.pfad) return;
    this._ruhe = Date.now() + 1500;  // während des Ziehens nicht neu zeichnen
    const v = el.dataset.leer && Number(el.value) >= Number(el.max) ? null : Number(el.value);
    this._setze(el.dataset.pfad, v, !fertig);
    const anz = this.shadowRoot.querySelector(`[data-anzeige="${el.dataset.pfad}"]`);
    if (anz) anz.textContent = v == null ? el.dataset.leer : `${zahl(v, 0)} ${el.dataset.einheit || ""}`;
    if (fertig) { this._ruhe = 0; this._render(); }
  }

  _boostAktiv() {
    const bis = this._cfg.heizstab?.boost_pana;
    return bis && new Date(bis) > new Date() ? new Date(bis) : null;
  }

  async _boostUmschalten() {
    const an = !this._boostAktiv();
    this._cfg.heizstab ??= {};
    this._cfg.heizstab.boost_pana = an ? new Date(Date.now() + 3600e3).toISOString() : null;
    this._render();
    const r = await this._senden({ type: "voltherm/home_boost", minute: an ? 60 : 0 });
    if (r && r.boost_pana !== undefined) { this._cfg.heizstab.boost_pana = r.boost_pana; this._render(); }
  }

  _hole(pfad) {
    return pfad.split(".").reduce((o, k) => o?.[k], this._cfg);
  }

  // Ändert eine Einstellung lokal und meldet sie nach außen (voltherm-aendern); das Panel speichert sie über voltherm/salveaza.
  _setze(pfad, wert, still = false) {
    const teile = pfad.split("."), letzt = teile.pop();
    let o = this._cfg;
    for (const k of teile) o = o[k] ??= {};
    o[letzt] = wert;
    if (still) return;
    this._hinweis = { zeit: Date.now(), text: `Gespeichert${this._sim() ? " · Simulation: an die Geräte geht nichts" : ""}` };
    this._senden({ type: "voltherm/home_seteaza", pfad, wert }).then(() => (pfad.startsWith("bilant.") ? this._bzLaden() : this._render()));
  }

  // ---------- Energie: Haus-Szene (gerendertes Haus, Geräte als Bilder, Energiefluss am Boden) ----------
  // Nur Geräte, die es gibt, werden gezeigt. Linien laufen vom Gerät zum Hausanschluss; die Punkte zeigen die Richtung.
  _bahn(von, w, farbe) {
    const d = `M${sz(von).join(" ")} L${sz(SZENE.hub).join(" ")}`, z = `M${sz(SZENE.hub).join(" ")} L${sz(von).join(" ")}`;
    const p = Math.abs(w || 0);
    if (p < 20) return `<path d="${d}" class="bahn"/>`;
    const dauer = Math.max(0.6, 3 - p / 3000).toFixed(2);
    return `<path d="${d}" class="bahn an" style="stroke:${farbe}"/>
      <path d="${w > 0 ? d : z}" class="strom" style="stroke:${farbe};color:${farbe};animation-duration:${dauer}s"/>`;
  }

  // Beschriftung wie bei GoodWe: große Zahl mit Einheit, darunter der Name; dunkles Schild, damit sie auch vor der Hauswand lesbar ist.
  _marke(punkt, [wert, einheit], titel, farbe, aktiv, unter = [], seite = "") {
    const [x, y] = sz(punkt), u = unter.filter(Boolean);
    const breit = Math.max(String(wert).length * 18 + String(einheit).length * 10 + 10, titel.length * 9 + 26, ...u.map((t) => t.length * 8.4)) + 24;
    const hoch = u.length ? 73 + u.length * 21 : 70;
    const zeilen = u.map((t, i) => `<text x="${x}" y="${y + 50 + i * 21}" class="m-unter">${esc(t)}</text>`).join("");
    return `<g class="marke-g ${aktiv ? "an" : ""}" ${seite ? `data-akt="seite|${seite}"` : ""} style="--f:${farbe}">
      <rect x="${(x - breit / 2).toFixed(1)}" y="${y - 36}" width="${breit.toFixed(1)}" height="${hoch}" rx="12" class="m-schild"/>
      <text x="${x}" y="${y}" class="m-wert">${esc(wert)}<tspan class="m-einh" dx="4">${esc(einheit)}</tspan></text>
      <text x="${x}" y="${y + 24}" class="m-titel"><tspan class="m-punkt">●</tspan> ${esc(titel)}</text>${zeilen}</g>`;
  }

  _fluss() {
    const pv = this._n("vt_pv_putere"), netz = this._n("vt_retea_putere"), bat = this._n("vt_baterie_putere");
    const soc = this._n("vt_baterie_soc"), haus = this._n("vt_consum_casa");
    const wb = this._n("vt_wallbox_putere"), hz = this._n("vt_heizstab_putere"), hzT = this._hzTemp();
    const demo = !!this._cfg.wallbox?.demo, wbAttr = this._s("vt_wallbox_decizie")?.attributes?.puncte?.[0];
    const wpS = this._s("vt_pompa_decizie"), wpA = wpS?.attributes || {}, wpP = wpA.putere;
    const raeume = this._s("vt_clima_decizie")?.attributes?.camere || [];
    const netzF = (netz || 0) > 0 ? C.netz_bezug : C.netz_einsp;
    const an = (w) => Math.abs(w || 0) > 20;
    const hat = { pv: pv != null, bat: soc != null || bat != null, netz: netz != null, wb: wb != null || !!wbAttr,
      hz: hz != null || hzT != null || !!this._s("vt_heizstab_decizie"), wp: !!wpS, kl: raeume.length > 0 };
    const wpAn = an(wpP) || Number(wpS?.state) >= 3;

    // Räume: Zustand der Klimageräte (heizt / kühlt / aus) und ob gerade Sonne gespeichert wird.
    const kl = raeume.map((r) => {
      const ent = this._s(r.entitate), hvac = ent?.state || "off", c = this._cfg.clima?.camere?.[r.entitate] || {};
      const laeuft = !["off", "unavailable", "unknown"].includes(hvac), ziel = r.decizie?.temp;
      const speichert = laeuft && ziel != null && (hvac === "heat" ? ziel > (c.confort_iarna ?? 21) + 0.05 : hvac === "cool" ? ziel < (c.confort_vara ?? 25) - 0.05 : false);
      const t = r.temp_camera ?? ent?.attributes?.current_temperature;
      return { name: r.nume || ent?.attributes?.friendly_name || "Klima", hvac, laeuft, speichert, t,
        farbe: speichert ? C.pv : hvac === "cool" ? C.batterie : laeuft ? C.heizstab : "#8e949e" };
    });
    const laufen = kl.filter((r) => r.laeuft).length;
    const G = SZENE.geraet;

    // Bodenlinien (unter den Bildern), dann Haus, dann Geräte von hinten nach vorne.
    const teile = [];
    if (hat.netz) teile.push(this._bahn(G.netz.fuss, netz, netzF));
    if (hat.bat) teile.push(this._bahn(G.bat.fuss, bat, C.batterie));
    if (hat.wb) teile.push(this._bahn(G.wb.fuss, demo ? 0 : -(wb || 0), C.wallbox));
    if (hat.kl) teile.push(this._bahn(G.kl.fuss, laufen ? -600 : 0, kl.some((r) => r.speichert) ? C.pv : C.klima));
    if (hat.wp) teile.push(this._bahn(G.wp.fuss, -(wpP ?? (wpAn ? 500 : 0)), C.wp));
    if (hat.hz) teile.push(this._bahn(hat.wp ? G.hzWp.fuss : G.hz.fuss, -(hz || 0), C.heizstab));
    const [hx, hy] = sz(SZENE.hub);
    teile.push(`<circle cx="${hx}" cy="${hy}" r="7" class="hub"/>`);

    const geraete = [];
    const zeig = (name, g, aktiv, farbe) => {
      if (aktiv) { const [fx, fy] = sz(g.fuss); geraete.push(`<ellipse cx="${fx}" cy="${fy}" rx="${((g.glanz || g.b * 0.55) * SZ).toFixed(1)}" ry="${((g.glanz || g.b * 0.55) * SZ * 0.3).toFixed(1)}" fill="${farbe}" class="glanz"/>`); }
      geraete.push(bild(name, g.x, g.y, g.b, "geraet"));
    };
    if (hat.netz) zeig("mast", G.netz, an(netz), netzF);
    if (hat.kl) zeig("klima", G.kl, laufen > 0, C.klima);
    if (hat.bat) zeig("batterie", G.bat, an(bat), C.batterie);
    if (hat.hz) zeig("boiler", hat.wp ? G.hzWp : G.hz, an(hz), C.heizstab);
    if (hat.wp) zeig("wp", G.wp, wpAn, C.wp);
    if (hat.wb) zeig("wallbox", G.wb, an(wb) && !demo, C.wallbox);

    // Räume als Schilder an den Fenstern (höchstens vier).
    const chips = kl.slice(0, SZENE.fenster.length).map((r, i) => {
      const [x, y] = sz(SZENE.fenster[i]), text = `${r.name} ${r.t == null ? "–" : `${zahl(r.t)}°`}${r.speichert ? " ☀" : ""}`, b = text.length * 7.6 + 30;
      return `<g class="chip" data-akt="seite|klima" style="--f:${r.farbe}"><rect x="${(x - b / 2).toFixed(1)}" y="${y - 14}" width="${b.toFixed(1)}" height="28" rx="14"/>
        <circle cx="${(x - b / 2 + 15).toFixed(1)}" cy="${y}" r="4.5" class="${r.laeuft ? "puls" : ""}"/><text x="${(x + 8).toFixed(1)}" y="${y + 5}">${esc(text)}</text></g>`;
    });

    // Beschriftungen
    const L = SZENE.marke, m = [];
    if (haus != null) m.push(this._marke(L.haus, wertE(haus), "Haus", C.haus, true));
    if (hat.pv) m.push(this._marke(L.pv, wertE(pv), "Photovoltaik", C.pv, an(pv), [], "pv"));
    if (hat.netz) m.push(this._marke(L.netz, wertE(netz), "Netz", netzF, an(netz),
      [netz == null ? "" : netz > 20 ? "Bezug" : netz < -20 ? "Einspeisung" : "ausgeglichen"]));
    if (hat.bat) m.push(this._marke(L.bat, soc == null ? ["–", ""] : [String(Math.round(soc)), "%"], "Speicher", C.batterie, an(bat),
      [bat == null ? "" : !an(bat) ? "Ruhe" : bat > 0 ? `entlädt ${kw(bat)}` : `lädt ${kw(bat)}`], "batterie"));
    if (hat.wb) m.push(this._marke(L.wb, demo ? ["Demo", ""] : wertE(wb), "Wallbox", C.wallbox, an(wb) && !demo,
      [demo ? "Testgerät" : wbAttr?.conectat ? `${wbAttr.masina || "Auto"}${wbAttr.soc != null ? ` · ${Math.round(wbAttr.soc)} %` : ""}` : "kein Auto"], "wallbox"));
    if (hat.kl) m.push(this._marke(L.kl, [String(laufen), `von ${kl.length} an`], "Klima", C.klima, laufen > 0, [], "klima"));
    if (hat.wp) m.push(this._marke(L.wp, wpP != null ? wertE(wpP) : [wpA.titlu || "–", ""], "Wärmepumpe", C.wp, wpAn,
      [wpP != null ? wpA.titlu : ""], "wp"));
    if (hat.hz) m.push(this._marke(hat.wp ? L.hzWp : L.hz, hzT != null ? [zahl(hzT), "°C"] : wertE(hz), "Warmwasser", C.heizstab, an(hz),
      [an(hz) ? `heizt ${kw(hz)}` : "aus"], "heizstab"));

    const [bw, bh] = sz([1456, 1088]);
    return `<svg viewBox="0 0 ${bw} ${bh}" preserveAspectRatio="xMidYMin meet" class="fluss-svg szene" role="img" aria-label="Energiefluss im Haus">
      <g class="inhalt">${bild(hat.pv ? "haus_pv" : "haus", 0, 0, 1456, "haus")}${teile.join("")}${geraete.join("")}${chips.join("")}${m.join("")}</g></svg>`;
  }

  // Ausschnitt auf das Gezeichnete setzen (Bild und Schilder), damit nichts abgeschnitten wird.
  _szeneEinpassen() {
    const svg = this.shadowRoot.querySelector(".szene"), g = svg?.querySelector(".inhalt");
    if (!g?.getBBox) return;
    // Schilder an die wirklich gezeichnete Schrift anpassen (am Handy ist die Schrift größer).
    svg.querySelectorAll(".marke-g, .chip").forEach((m) => {
      const rect = m.querySelector("rect"), txt = [...m.querySelectorAll("text")].map((t) => t.getBBox()).filter((t) => t.width);
      if (!rect || !txt.length) return;
      const chip = m.classList.contains("chip"), px = chip ? 10 : 14, py = chip ? 5 : 8, links = chip ? 22 : 0;
      const x0 = Math.min(...txt.map((t) => t.x)) - px - links, x1 = Math.max(...txt.map((t) => t.x + t.width)) + px;
      const y0 = Math.min(...txt.map((t) => t.y)) - py, y1 = Math.max(...txt.map((t) => t.y + t.height)) + py;
      rect.setAttribute("x", x0.toFixed(1)); rect.setAttribute("y", y0.toFixed(1));
      rect.setAttribute("width", (x1 - x0).toFixed(1)); rect.setAttribute("height", (y1 - y0).toFixed(1));
      if (chip) { m.querySelector("circle")?.setAttribute("cx", (x0 + 13).toFixed(1)); rect.setAttribute("rx", ((y1 - y0) / 2).toFixed(1)); }
    });
    const b = g.getBBox();
    if (!b.width) return;
    const r = 8;
    svg.setAttribute("viewBox", `${(b.x - r).toFixed(0)} ${(b.y - r).toFixed(0)} ${(b.width + 2 * r).toFixed(0)} ${(b.height + 2 * r).toFixed(0)}`);
  }

  // Temperatur nur aus einem Fühler, der wirklich im Speicher sitzt; sonst unbekannt.
  _hzTemp() {
    return this._cfg.heizstab?.temp_sigura === false ? null : this._n("vt_heizstab_temperatura");
  }

  _wallboxTitel(dec) {
    if (dec.mod === "pv" && /aus dem Netz/.test(dec.motiv || "")) return "Sonne + Nachtladung";
    return MOD_WALLBOX[dec.mod] || dec.mod;
  }

  _preisliste() {
    return this._s("vt_pret_curent")?.attributes?.preturi || [];
  }

  // Preisbalken; markiere(p, i) gibt die Klasse je Stunde, grenze (EUR/kWh) zeichnet eine gestrichelte Linie.
  _balken(ore, markiere = () => "", grenze = null) {
    if (!ore.length) return '<div class="leerhinweis">Noch keine Strompreise.</div>';
    const werte = ore.map((p) => p.pret);
    const max = Math.max(...werte, grenze ?? 0) * 1.03, basis = Math.min(...werte, grenze ?? Infinity) * 0.85;
    const y = (v) => 10 + 90 * (v - basis) / (max - basis || 1);
    const jede = ore.length > 16 ? 3 : 1;
    const bars = ore.map((p, i) => `<div class="pb ${markiere(p, i)}"><i style="height:${y(p.pret)}%" title="${p.ora.slice(11, 16)} · ${zahl(p.pret * 100)} ct"></i>
      <span class="${i % jede ? "klein" : ""}">${p.ora.slice(11, 13)}</span></div>`).join("");
    const linie = grenze != null ? `<div class="grenze" style="bottom:calc(18px + (100% - 18px) * ${(y(grenze) / 100).toFixed(3)})"><span>max. ${zahl(grenze * 100, 0)} ct</span></div>` : "";
    return `<div class="balken">${bars}${linie}</div>`;
  }

  _preise() {
    const ore = this._preisliste().slice(0, 24);
    if (!ore.length) return "";
    const billig = new Set([...ore].sort((a, b) => a.pret - b.pret).slice(0, 4).map((p) => p.ora));
    const teuer = new Set([...ore].sort((a, b) => b.pret - a.pret).slice(0, 4).map((p) => p.ora));
    const w = ore.map((p) => p.pret);
    return `<div class="karte preise"><div class="kopf"><span class="etikett">Strompreis · nächste 24 Stunden</span>
        <span class="mini"><b class="lg billig"></b>günstig <b class="lg teuer"></b>teuer</span></div>
      ${this._balken(ore, (p, i) => (i === 0 ? "jetzt" : billig.has(p.ora) ? "billig" : teuer.has(p.ora) ? "teuer" : ""))}
      <div class="spanne">${zahl(Math.min(...w) * 100)} – ${zahl(Math.max(...w) * 100)} ct/kWh</div></div>`;
  }

  _jetzt() {
    const zeilen = [];
    const bat = this._s("vt_baterie_decizie");
    if (bat?.attributes?.motiv) zeilen.push(["batterie", C.batterie, "Speicher", bat.attributes.actiune, bat.attributes.motiv]);
    const wb = this._s("vt_wallbox_decizie")?.attributes?.puncte?.[0];
    if (wb?.decizie) zeilen.push(["wallbox", C.wallbox, "Wallbox", this._wallboxTitel(wb.decizie), wb.decizie.motiv]);
    const hz = this._s("vt_heizstab_decizie");
    if (hz?.attributes?.motiv) zeilen.push(["heizstab", C.heizstab, "Warmwasser", MOD_HEIZSTAB[hz.attributes.mod] || kw(Number(hz.state) || 0), hz.attributes.motiv]);
    const wp = this._s("vt_pompa_decizie");
    if (wp?.attributes?.motiv) zeilen.push(["wp", C.wp, "Wärmepumpe", wp.attributes.titlu, wp.attributes.motiv]);
    const kl = this._s("vt_clima_decizie");
    for (const r of kl?.attributes?.camere || []) if (r.decizie) zeilen.push(["klima", C.klima, r.nume || "Klima", r.decizie.titlu, r.decizie.motiv]);
    if (!zeilen.length) return "";
    return `<div class="karte jetzt"><div class="kopf"><span class="etikett">VOLTHERM jetzt</span>${this._sim() ? '<span class="sim">Simulation</span>' : ""}</div>
      ${zeilen.map(([s, f, wer, was, warum]) => `<button class="zeile" data-akt="seite|${s}" style="--f:${f}"><b>${esc(wer)}</b><span class="was">${esc(was)}</span><span class="warum">${esc(warum)}</span></button>`).join("")}</div>`;
  }

  _sim() {
    return ["vt_baterie_decizie", "vt_heizstab_decizie", "vt_pompa_decizie", "vt_clima_decizie", "vt_wallbox_decizie"]
      .some((id) => this._s(id)?.attributes?.comanda === "simulare");
  }

  _heute() {
    const h = this._s("vt_heute")?.attributes;
    const werte = h ? [["Erzeugt", `${zahl(h.erzeugt)} kWh`, C.pv], ["Verbraucht", `${zahl(h.verbraucht)} kWh`, C.haus],
      ["Autarkie", h.autarkie == null ? "–" : `${Math.round(h.autarkie)} %`, C.netz_einsp], ["Ersparnis", `${zahl(h.ersparnis, 2)} €`, C.wallbox]] : [];
    if (!werte.length) return "";
    return `<div class="karte heute"><span class="etikett">Heute</span><div class="kacheln">
      ${werte.map(([t, v, f]) => `<div><span>${t}</span><b style="color:${f}">${v}</b></div>`).join("")}</div></div>`;
  }

  // Systempflege: Home Assistant, evcc und Co. aktualisiert VOLTHERM nachts selbst, nur mit freigegebenen Versionen.
  _pflegeZeile() {
    const p = this._cfg.systempflege;
    if (!p) return "";
    const farbe = { ok: "#3DDC97", nacht: "#19C3E6", laeuft: "#19C3E6", service: "#FFC531" }[p.stufe] || "var(--text)";
    return `<div><span>Systempflege</span><b style="color:${farbe}">${esc(p.text)}</b></div>`;
  }

  // Service-Zugang (Tailscale): der Kunde sieht, wann der Service verbunden war, und kann ihn sperren.
  _fernKarte() {
    const f = this._cfg.fern;
    if (!f) {
      return this._cfg.systempflege ? `<section class="karte fern"><div class="kopf"><span class="etikett">Service</span></div>
        <div class="zeilen">${this._pflegeZeile()}</div></section>` : "";
    }
    const am = (t) => new Date(t).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const v = f.verbindungen || [];
    return `<section class="karte fern"><div class="kopf"><span class="etikett">Service-Zugang</span></div>
      <div class="fern-zeile"><div><b>VOLTHERM-Service darf sich verbinden</b>
        <small>${f.erlaubt ? "Erlaubt. Der Service kann Störungen aus der Ferne prüfen und Updates einspielen." : "Gesperrt. Niemand kann sich von außen verbinden."}</small></div>
        <button class="sw" role="switch" aria-checked="${!!f.erlaubt}" aria-label="Service-Zugang" data-akt="fern|${f.erlaubt ? "aus" : "an"}"></button></div>
      <div class="zeilen">${v.length ? v.slice(0, 2).map((x, i) => `<div><span>${i ? "Davor" : "Zuletzt verbunden"}</span><b>${am(x.t)} Uhr, ${esc(x.wer)}</b></div>`).join("")
        : `<div><span>Zuletzt verbunden</span><b>noch nie</b></div>`}${this._pflegeZeile()}</div></section>`;
  }

  async _fern(an) {
    const r = this._extern ? { ...this._cfg.fern, erlaubt: an } : await this._senden({ type: "voltherm/home_fern", erlaubt: an });
    if (r) { this._cfg.fern = r; this._hinweis = { zeit: Date.now(), text: an ? "Service-Zugang erlaubt." : "Service-Zugang gesperrt." }; }
    this._render();
  }

  // Update VOLTHERM: der Kunde aktualisiert hier, auf Tablet oder Handy, nie in Home Assistant.
  _updateHtml() {
    const u = this._cfg?.update;
    const laeuft = u?.laeuft || Date.now() - (this._updSeit || 0) < 300000;
    if (laeuft) {
      return `<div class="sicher upd" role="status"><span class="sym">${ico("rund", "#04222a", 20)}</span>
        <div><b>VOLTHERM wird aktualisiert…</b><small>Das dauert etwa zwei Minuten. Ihre Anlage läuft in dieser Zeit normal weiter, danach lädt der Bildschirm von selbst.</small></div></div>`;
    }
    if (!u?.version || this._updZu === u.version) return "";
    if (this._updFrage) {
      return `<div class="sicher upd frage" role="dialog" aria-label="VOLTHERM aktualisieren"><span class="sym">↑</span>
        <div><b>VOLTHERM jetzt aktualisieren?</b><small>Der Bildschirm ist etwa zwei Minuten nicht erreichbar. Ihre Anlage läuft in dieser Zeit normal weiter.</small></div>
        <div class="knoepfe"><button data-akt="upd|ja" class="voll">Jetzt aktualisieren</button><button data-akt="upd|nein">Abbrechen</button></div></div>`;
    }
    return `<div class="sicher upd" role="status"><span class="sym">↑</span>
      <div><b>Update verfügbar: VOLTHERM ${esc(u.version)}</b><small>Verbesserungen für Ihre Anlage. Ein Tipp genügt, VOLTHERM erledigt den Rest.</small></div>
      <div class="knoepfe"><button data-akt="upd|frage" class="voll">Aktualisieren</button><button data-akt="upd|spaeter">Später</button></div></div>`;
  }

  async _update(a) {
    const u = this._cfg?.update;
    this._updFrage = a === "frage";
    if (a === "spaeter" && u) {
      this._updZu = u.version;
      try { localStorage.setItem("voltherm-update-zu", u.version); } catch { /* Vorschau ohne Speicher */ }
    }
    if (a === "ja" && !this._updSeit) {
      this._updSeit = Date.now();  // Band sofort auf „wird aktualisiert“: kein zweiter Tipp, keine zweite Installation
      this._render();
      const r = this._extern ? true : await this._senden({ type: "voltherm/home_update" });
      if (!r) this._updSeit = 0;
    }
    this._render();
  }

  // Clientul mulțumit arată prezentarea unui prieten: aici pe ecran sau, prin cod, pe telefonul prietenului.
  _praesKarte() {
    // Nu în demo: pe site demo-ul stă chiar în prezentare, iar în aplicație demo-ul e offline (about:blank).
    if (!/^https?:$/.test(location.protocol) || location.href.startsWith(PRAES_URL)) return "";
    return `<section class="karte praes"><div class="praes-text"><span class="etikett">VOLTHERM weiterempfehlen</span>
        <b>Freunde fragen, was Ihr Haus da macht?</b>
        <small>Zeigen Sie ihnen die kurze Präsentation, auf Wunsch mit Sprecher.<span class="praes-qrtext"> Oder sie scannen den Code und schauen sie sich auf dem eigenen Handy an.</span></small>
        <div class="praes-knoepfe"><button class="praes-knopf" data-akt="praes|auf"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg><span>Präsentation zeigen</span></button>
          <button class="praes-knopf leise" data-akt="praes|demo"><span>Beispielanlage zeigen</span></button></div>
        <small class="praes-hinweis">Die Beispielanlage zeigt alle Geräte, die VOLTHERM steuern kann (auch Klima und Wärmepumpe), mit Beispielwerten.</small></div>
      <figure class="praes-qr">${PRAES_QR}<figcaption>Mit dem eigenen Handy scannen</figcaption></figure></section>`;
  }

  // Ecran întreg peste VOLTHERM Home. Iframe-ul stă în afara redesenării (vezi _render), deci nu se reîncarcă la fiecare valoare nouă.
  // was: "auf" = prezentarea, "demo" = instalația-exemplu de pe site (toate aparatele, valori de exemplu), null = închis.
  _praesentation(was) {
    const auf = !!was;
    this._praes = auf;
    this.shadowRoot.querySelector(".praes-ebene")?.remove();
    if (!auf) { this._render(); return; }
    const ebene = document.createElement("div");
    ebene.className = "praes-ebene";
    ebene.setAttribute("role", "dialog");
    const demo = was === "demo", titel = demo ? "VOLTHERM Beispielanlage" : "Was ist VOLTHERM?";
    ebene.setAttribute("aria-label", titel);
    ebene.innerHTML = `<div class="praes-leiste"><span>${demo ? "<b>VOLTHERM</b> Beispielanlage" : "Was ist <b>VOLTHERM</b>?"}</span>
        <button data-akt="praes|zu">✕ Schließen</button></div>
      <iframe src="${PRAES_URL}${demo ? "demo.html" : ""}" title="${titel}" allow="autoplay; fullscreen"></iframe>`;
    this.shadowRoot.append(ebene);
  }

  _seiteEnergie() {
    return `<div class="raster-energie"><section class="karte fluss">${this._fluss()}</section>
      <aside>${this._jetzt()}${this._heute()}</aside>${this._preise()}</div>`;
  }

  // ---------- Bausteine ----------
  _kopfModul(farbe, icon, titel, unter) {
    return `<div class="modulkopf" style="--f:${farbe}">${ico(icon, farbe, 34)}<div><h1>${esc(titel)}</h1>${unter ? `<p>${unter}</p>` : ""}</div></div>`;
  }

  _warum(farbe, titel, text) {
    if (!text) return "";
    return `<div class="karte warum-karte" style="--f:${farbe}"><div class="kopf"><span class="etikett">VOLTHERM jetzt</span>${this._sim() ? '<span class="sim">Simulation</span>' : ""}</div>
      <b>${esc(titel)}</b><p>${esc(text)}</p></div>`;
  }

  _wahl(pfad, aktuell, optionen, farbe) {
    return `<div class="wahl" role="group" style="--f:${farbe}">${optionen.map(([w, t]) => `<button data-akt="setze|${pfad}" data-wert="${w}" aria-pressed="${String(aktuell) === String(w)}">${t}</button>`).join("")}</div>`;
  }

  _stepper(pfad, wert, einheit, schritt, min, max, z = 0) {
    const attr = `data-min="${min}" data-max="${max}" data-start="${wert ?? min}"`;
    return `<div class="stepper"><button data-akt="schritt|${pfad}|${-schritt}" ${attr} aria-label="weniger">−</button>
      <b>${wert == null ? "–" : zahl(wert, z)}<small>${einheit}</small></b>
      <button data-akt="schritt|${pfad}|${schritt}" ${attr} aria-label="mehr">+</button></div>`;
  }

  // Schieberegler; mit `leer` bedeutet ganz rechts „keine Grenze“ (null).
  _regler(pfad, wert, min, max, schritt, einheit, farbe, leer) {
    const v = wert == null ? max : wert;
    return `<div class="regler" style="--f:${farbe}"><input type="range" min="${min}" max="${max}" step="${schritt}" value="${v}" data-pfad="${pfad}" data-einheit="${einheit}" ${leer ? `data-leer="${leer}"` : ""} aria-label="${einheit}">
      <b data-anzeige="${pfad}">${leer && wert == null ? leer : `${zahl(v, 0)} ${einheit}`}</b></div>`;
  }

  _feld(titel, inhalt, hilfe = "") {
    return `<div class="feld"><span class="etikett">${titel}</span>${inhalt}${hilfe ? `<small class="hilfe">${hilfe}</small>` : ""}</div>`;
  }

  // Großer Ladestand-Ring mit Strich für Ziel bzw. Reserve.
  _ring(prozent, farbe, mitte, unter, strich = null) {
    const r = 92, u = 2 * Math.PI * r, p = Math.max(0, Math.min(100, prozent ?? 0));
    let s = "";
    if (strich != null) {
      const a = (strich / 100) * 2 * Math.PI - Math.PI / 2;
      s = `<line x1="${110 + 80 * Math.cos(a)}" y1="${110 + 80 * Math.sin(a)}" x2="${110 + 104 * Math.cos(a)}" y2="${110 + 104 * Math.sin(a)}" class="zielstrich"/>`;
    }
    return `<svg viewBox="0 0 220 220" class="ring-gross" style="--f:${farbe}" role="img" aria-label="${esc(mitte)}">
      <circle cx="110" cy="110" r="${r}" class="ring-bahn"/>
      <circle cx="110" cy="110" r="${r}" class="ring-wert" stroke-dasharray="${u * p / 100} ${u}" transform="rotate(-90 110 110)"/>
      ${s}<text x="110" y="112" class="ring-zahl">${esc(mitte)}</text><text x="110" y="142" class="ring-unter">${esc(unter)}</text></svg>`;
  }

  // Siguranța: din sensor.vt_sicherheit (live); în previzualizare din datele Home.
  _sicherheit() {
    const s = this._s("vt_sicherheit");
    if (s && !["unknown", "unavailable"].includes(s.state)) {
      const a = s.attributes || {};
      const cauze = [...(a.cauze || [])].sort((x, y) => ["start", "pauza", "test"].includes(x.cheie) - ["start", "pauza", "test"].includes(y.cheie));
      return { stare: s.state, pauza_pana: a.pauza_pana, cauze };
    }
    const c = this._cfg.sicherheit;
    return c ? { stare: c.stare, pauza_pana: c.pauza_pana, cauze: c.text ? [{ cheie: c.stare === "pausiert" ? "pauza" : "x", text: c.text }] : [] } : null;
  }

  async _pausieren(an) {
    this._pauseFrage = false;
    const r = await this._senden({ type: "voltherm/home_pause", an });
    if (r) this._hinweis = { zeit: Date.now(), text: an ? "VOLTHERM pausiert: Alle Geräte laufen normal." : "VOLTHERM steuert wieder." };
    if (this._extern) { this._cfg.sicherheit = an ? { stare: "pausiert", pauza_pana: new Date(Date.now() + 864e5).toISOString(), text: "Vom Kunden pausiert." } : { stare: "normal" }; }
    else await this._laden();
    this._render();
  }

  // Band unten: sicherer Betrieb (bleibt, bis die Störung vorbei ist) oder Pause; plus die Rückfrage vor dem Pausieren.
  _sicherHtml() {
    if (this._pauseFrage) {
      return `<div class="sicher frage" role="dialog" aria-label="VOLTHERM pausieren"><span class="sym">${ico("pause", "#1a1200", 20)}</span>
        <div><b>VOLTHERM pausieren?</b><small>Alle Geräte laufen dann nach ihren eigenen Einstellungen, ohne Optimierung, bis Sie fortsetzen (höchstens 24 Stunden).</small></div>
        <div class="knoepfe"><button data-akt="pause|an" class="voll">Pausieren</button><button data-akt="pause|nein">Abbrechen</button></div></div>`;
    }
    const st = this._sicherheit();
    if (!st || st.stare === "normal") return "";
    if (st.stare === "pausiert") {
      const bis = st.pauza_pana ? new Date(st.pauza_pana) : null;
      return `<div class="sicher" role="status"><span class="sym">${ico("pause", "#1a1200", 20)}</span>
        <div><b>VOLTHERM pausiert${bis ? ` bis ${bis.toLocaleString("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" })} Uhr` : ""}</b><small>Alle Geräte laufen normal, ohne Optimierung.</small></div>
        <div class="knoepfe"><button data-akt="pause|aus" class="voll">Fortsetzen</button></div></div>`;
    }
    const c = st.cauze.find((x) => x.cheie !== "start");
    if (!c || this._sicherZu === c.text) return "";  // Neustart: still; „Verstanden“ blendet bis zur nächsten Störung aus
    return `<div class="sicher" role="status"><span class="sym">!</span>
      <div><b>Sicherer Betrieb</b><small>${esc(c.text)} Ihre Anlage läuft normal weiter, nur ohne Optimierung.</small></div>
      <div class="knoepfe"><button data-akt="sicherzu|${esc(c.text)}">Verstanden</button></div></div>`;
  }

  _mehrHtml(seiten) {
    if (!this._mehr) return "";
    const haupt = this._handyHaupt(seiten), rest = seiten.filter(([id]) => !haupt.includes(id));
    return `<div class="mehrblatt" role="menu">${rest.map(([id, t, f]) => `<button role="menuitem" data-akt="seite|${id}" aria-current="${id === this._seite}" style="--f:${f}">${ico(id, f, 24)}<span>${t}</span></button>`).join("")}</div>`;
  }

  // Banda de sus: ultimul mesaj VOLTHERM (sensor.vt_ansage), vizibil 60 s; atingerea o închide.
  _ansageHtml() {
    const s = this._s("vt_ansage"), a = s?.attributes;
    if (!a?.zeit || !s.state || ["unknown", "unavailable"].includes(s.state)) return "";
    const zeit = new Date(a.zeit);
    if (Date.now() - zeit > 60000 || this._ansageZu === a.zeit) return "";
    const f = { auto_laedt: C.wallbox, auto_wartet: C.wallbox, auto_voll: C.netz_einsp, wasser: C.heizstab, speicher: C.batterie,
      guenstig: C.pv, bilanz: C.netz_einsp, stoerung: C.netz_bezug }[a.eveniment] || "#19C3E6";
    return `<button class="ansage" data-akt="ansagezu|${esc(a.zeit)}" style="--f:${f}" role="status">
      <b>${esc(a.titlu || "VOLTHERM")}</b><span>${esc(s.state)}</span><small>${zeit.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}</small></button>`;
  }

  _hinweisHtml() {
    const h = this._hinweis;
    if (!h || Date.now() - h.zeit > (h.fehler ? 6000 : 2500)) return "";
    return `<div class="toast ${h.fehler ? "fehler" : ""}" role="status">${esc(h.text)}</div>`;
  }

  // ---------- PV (nur Info) ----------
  _seitePv() {
    const pv = this._n("vt_pv_putere"), d = this._cfg.pv || {};
    const prog = d.prognoza || [];
    let kurve = "";
    if (prog.length) {
      const max = Math.max(...prog.map((p) => p.w), pv || 0) * 1.1 || 1, n = prog.length - 1;
      const x = (i) => 50 + (910 * i) / n, y = (w) => 250 - (220 * w) / max;
      const pfad = prog.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.w).toFixed(1)}`).join(" ");
      const jetztI = prog.findIndex((p) => p.ora.slice(0, 13) === cheie(new Date()).slice(0, 13));
      const ticks = prog.map((p, i) => (i % 2 ? "" : `<text x="${x(i)}" y="278" class="achse">${p.ora.slice(11, 13)}</text>`)).join("");
      const stufen = [2, 4, 6, 8, 10, 12, 15, 20].map((k) => k * 1000).filter((k) => k < max);
      const gitter = stufen.map((k) => `<line x1="50" x2="960" y1="${y(k)}" y2="${y(k)}" class="gitter"/><text x="42" y="${y(k) + 4}" class="achse rechtsb">${k / 1000}</text>`).join("");
      const punkt = jetztI >= 0 && pv != null ? `<line x1="${x(jetztI)}" x2="${x(jetztI)}" y1="20" y2="250" class="jetztlinie"/><circle cx="${x(jetztI)}" cy="${y(pv)}" r="7" class="jetztpunkt"/>` : "";
      kurve = `<svg viewBox="0 0 1000 290" class="kurve" role="img" aria-label="PV-Prognose heute">
        <defs><linearGradient id="pvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.pv}" stop-opacity=".45"/><stop offset="1" stop-color="${C.pv}" stop-opacity="0"/></linearGradient></defs>
        ${gitter}<line x1="50" x2="960" y1="250" y2="250" class="gitter"/>
        <path d="${pfad} L${x(n)} 250 L50 250 Z" fill="url(#pvg)"/><path d="${pfad}" fill="none" stroke="${C.pv}" stroke-width="3"/>${punkt}${ticks}
        <text x="12" y="16" class="achse links">kW</text></svg>`;
    }
    const kacheln = [["Jetzt", kw(pv)], ["Heute erzeugt", d.heute_kwh != null ? `${zahl(d.heute_kwh)} kWh` : "–"],
      ["Prognose heute", d.prognose_heute_kwh != null ? `${zahl(d.prognose_heute_kwh)} kWh` : "–"], ["Prognose morgen", d.morgen_kwh != null ? `${zahl(d.morgen_kwh)} kWh` : "–"]];
    return `${this._kopfModul(C.pv, "pv", "Photovoltaik", "Nur Anzeige: Die Anlage läuft von selbst.")}
      <div class="raster-modul pv-raster">
        <div class="karte kachelreihe">${kacheln.map(([t, v], i) => `<div><span class="etikett">${t}</span><b style="${i === 0 ? `color:${C.pv}` : ""}">${v}</b></div>`).join("")}</div>
        <div class="karte"><div class="kopf"><span class="etikett">Sonnenstrom heute · Prognose</span><span class="mini">Punkt: jetzt</span></div>${kurve || '<div class="leerhinweis">Keine Prognose eingerichtet.</div>'}</div>
      </div>`;
  }

  // ---------- Speicher ----------
  _seiteBatterie() {
    const soc = this._n("vt_baterie_soc"), p = this._n("vt_baterie_putere"), cfg = this._cfg.baterie || {};
    const dec = this._s("vt_baterie_decizie")?.attributes || {};
    const plan = this._s("vt_plan_baterie")?.attributes || {};
    const cap = cfg.capacitate || 30;
    const geplant = new Set((plan.ore || []).map((o) => o.slice(0, 13)));
    const ore = this._preisliste().slice(0, 24);
    const lad = cfg.prag_incarcare_ct, ent = cfg.prag_descarcare_ct;
    const zustand = p == null ? "" : Math.abs(p) < 20 ? "Ruhe" : p > 0 ? `entlädt ${kw(p)}` : `lädt ${kw(p)}`;
    const f = C.batterie;
    return `${this._kopfModul(f, "batterie", "Speicher", `${soc == null ? "–" : zahl(soc / 100 * cap)} von ${zahl(cap, 0)} kWh gespeichert`)}
      <div class="raster-modul">
        <div class="karte mitte">${this._ring(soc, f, soc == null ? "–" : `${Math.round(soc)} %`, zustand, cfg.soc_minim)}
          <small class="hilfe">Weißer Strich: Reserve ${cfg.soc_minim ?? "–"} %</small></div>
        <div class="karte einstellungen">
          ${this._feld("Reserve für Stromausfall", this._stepper("baterie.soc_minim", cfg.soc_minim, "%", 5, 5, 50))}
          ${this._feld("Aus dem Netz laden bis max.", this._regler("baterie.prag_incarcare_ct", lad, 10, 40, 1, "ct", f), "Nur nachts in den günstigsten Stunden und nur so viel, wie morgen die Sonne nicht liefert.")}
          ${this._feld("Entladen erst ab", this._regler("baterie.prag_descarcare_ct", ent, 15, 50, 1, "ct", f), "Darunter spart der Speicher seine Energie für die teuren Stunden.")}
        </div>
        <div class="karte breit" style="--f:${f}"><div class="kopf"><span class="etikett">Nachtladung · geplante Stunden</span>
          <span class="mini"><b class="lg geplant" style="background:${f}"></b>geplant <b class="lg jetzt"></b>jetzt</span></div>
          ${this._balken(ore, (x, i) => (geplant.has(x.ora.slice(0, 13)) ? "geplant" : i === 0 ? "jetzt" : ""), lad != null ? lad / 100 : null)}
          <p class="planzeile">${geplant.size ? `${geplant.size} Stunden geplant (${[...geplant].sort().map((o) => o.slice(11, 13)).join(", ")} Uhr), höchstens ${zahl((plan.pret_max || 0) * 100)} ct.` : esc(plan.motiv || "Heute Nacht ist keine Netzladung nötig.")}</p></div>
        ${this._warum(f, dec.actiune, dec.motiv)}
      </div>`;
  }

  // ---------- Wallbox ----------
  _ladeplan(p, c) {
    const preturi = this._preisliste();
    if (!p?.conectat || p.soc == null || !preturi.length) return null;
    const cap = p.capacitate || 50, leistung = (p.putere_max || 11040) / 1000, ziel = Number(c.soc_tinta) || 80;
    const nevoie = Math.max(0, (ziel - p.soc) / 100 * cap / 0.9);
    const [hh, mm] = (c.plecare || "07:00").split(":").map(Number);
    const acum = new Date(), plecare = new Date(acum); plecare.setHours(hh, mm, 0, 0);
    if (plecare <= acum) plecare.setDate(plecare.getDate() + 1);
    const ore = preturi.filter((x) => x.ora.slice(0, 13) >= cheie(acum).slice(0, 13) && x.ora.slice(0, 13) < cheie(plecare).slice(0, 13));
    const prag = c.pret_max == null ? null : Number(c.pret_max) / 100;
    const nOre = Math.ceil(nevoie / leistung);
    const unter = ore.filter((x) => prag == null || x.pret <= prag).sort((a, b) => a.pret - b.pret);
    const ueber = ore.filter((x) => prag != null && x.pret > prag).sort((a, b) => a.pret - b.pret);
    let alese = unter.slice(0, nOre);
    const fortate = nOre - alese.length > 0 && c.peste_prag !== "asteapta" ? ueber.slice(0, nOre - alese.length) : [];
    alese = [...alese, ...fortate];
    let rest = nevoie, kosten = 0;
    for (const x of alese) { const e = Math.min(leistung, rest); kosten += e * x.pret; rest -= e; }
    return { ore, prag, alese: new Set(alese.map((x) => x.ora)), fortate: new Set(fortate.map((x) => x.ora)), nevoie, kosten,
      socFinal: Math.min(ziel, p.soc + (nevoie - rest) * 0.9 / cap * 100), ziel };
  }

  _seiteWallbox() {
    const attr = this._s("vt_wallbox_decizie")?.attributes || {};
    const p = attr.puncte?.[0], id = p?.id || "1";
    this._cfg.wallbox ??= {}; this._cfg.wallbox.puncte ??= {};
    const c = this._cfg.wallbox.puncte[id] = { mod: "auto", plecare: "07:00", soc_tinta: 80, pret_max: null, peste_prag: "incarca", ...(this._cfg.wallbox.puncte[id] || {}) };
    const leistung = this._n("vt_wallbox_putere");
    const pl = c.mod === "auto" ? this._ladeplan(p, c) : null;
    const pfad = `wallbox.puncte.${id}`, f = C.wallbox;
    let zeile = "";
    if (c.mod !== "auto") zeile = `Im Modus „${{ pv: "Nur Sonne", now: "Sofort", off: "Aus" }[c.mod] || c.mod}“ gilt kein Zeitplan.`;
    else if (pl) {
      const ore = [...pl.alese].sort().map((o) => o.slice(11, 16)).join(", ");
      zeile = pl.nevoie <= 0 ? `Das Auto ist schon über ${pl.ziel} %: geladen wird nur mit Sonnenstrom.`
        : pl.socFinal >= pl.ziel - 0.5 ? `Ich lade ${zahl(pl.nevoie)} kWh um ${ore} Uhr. Kosten etwa <b>${zahl(pl.kosten, 2)} €</b>. Fertig um ${c.plecare} ✓${pl.fortate.size ? `<br><small>${pl.fortate.size} Std. über der Preisgrenze (orange), damit das Auto rechtzeitig fertig ist.</small>` : ""}`
          : `<span class="warn">⚠ Unter ${zahl(pl.prag * 100, 0)} ct schafft das Auto bis ${c.plecare} nur etwa ${Math.round(pl.socFinal)} % statt ${pl.ziel} %. Den Rest lädt die Sonne.</span>`;
    }
    return `${this._kopfModul(f, "wallbox", "Wallbox", this._cfg.wallbox?.demo ? "Demo-Wallbox (Testgerät): Werte sind nicht echt" : p?.conectat ? `${esc(p.masina || "Auto")} angesteckt` : "Kein Auto angesteckt")}
      <div class="raster-modul">
        <div class="karte mitte">${this._ring(p?.soc, f, p?.soc == null ? "–" : `${Math.round(p.soc)} %`, (leistung || 0) > 20 ? `lädt ${kw(leistung)}` : "lädt gerade nicht", c.soc_tinta)}
          <small class="hilfe">Weißer Strich: Ladeziel ${c.soc_tinta} %</small></div>
        <div class="karte einstellungen">
          ${this._feld("Laden", this._wahl(`${pfad}.mod`, c.mod, [["off", "Aus"], ["pv", "Nur Sonne"], ["auto", "Automatisch"], ["now", "Sofort"]], f),
            c.mod === "auto" ? "Mit Sonne und in den günstigsten Stunden, damit das Auto rechtzeitig fertig ist." : "")}
          <div class="zwei">${this._feld("Fertig bis", `<div class="stepper"><button data-akt="zeit|${pfad}.plecare|-30" aria-label="früher">−</button><b>${esc(c.plecare)}</b><button data-akt="zeit|${pfad}.plecare|30" aria-label="später">+</button></div>`)}
            ${this._feld("Ladeziel", this._stepper(`${pfad}.soc_tinta`, c.soc_tinta, "%", 5, 20, 100))}</div>
          ${this._feld("Max. Preis aus dem Netz", this._regler(`${pfad}.pret_max`, c.pret_max, 15, 45, 1, "ct", f, "keine Grenze"))}
        </div>
        <div class="karte breit" style="--f:${f}"><div class="kopf"><span class="etikett">Strompreis bis ${esc(c.plecare)} · gewählte Stunden</span>
          <span class="mini"><b class="lg geplant" style="background:${f}"></b>laden <b class="lg fortat"></b>über Grenze, nötig</span></div>
          ${pl ? this._balken(pl.ore, (x) => (pl.fortate.has(x.ora) ? "fortat" : pl.alese.has(x.ora) ? "geplant" : pl.prag != null && x.pret > pl.prag ? "ueber" : ""), pl.prag)
            : `<div class="leerhinweis">${c.mod !== "auto" ? "" : "Der Plan erscheint, wenn ein Auto angesteckt ist."}</div>`}
          ${zeile ? `<p class="planzeile">${zeile}</p>` : ""}</div>
        ${p?.decizie ? this._warum(f, this._wallboxTitel(p.decizie), p.decizie.motiv) : ""}
      </div>`;
  }

  // ---------- Warmwasser ----------
  _seiteHeizstab() {
    const t = this._hzTemp(), p = this._n("vt_heizstab_putere"), cfg = this._cfg.heizstab || {};
    const dec = this._s("vt_heizstab_decizie")?.attributes || {};
    const min = cfg.temp_min ?? 45, max = cfg.temp_max ?? 65, skala = [20, 80], f = C.heizstab;
    const y = (v) => 300 - (260 * (Math.min(skala[1], Math.max(skala[0], v)) - skala[0])) / (skala[1] - skala[0]);
    const tank = `<svg viewBox="0 0 270 330" class="tank" role="img" aria-label="Speichertemperatur">
      <defs><linearGradient id="wg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4D8DFF"/><stop offset=".55" stop-color="${f}"/><stop offset="1" stop-color="#FF3B3B"/></linearGradient>
      <clipPath id="tk"><rect x="60" y="40" width="100" height="260" rx="40"/></clipPath></defs>
      <rect x="60" y="40" width="100" height="260" rx="40" class="tankhuelle"/>
      ${t != null ? `<rect x="60" y="${y(t)}" width="100" height="${300 - y(t)}" fill="url(#wg)" clip-path="url(#tk)" opacity=".9"/>` : ""}
      <line x1="48" x2="172" y1="${y(min)}" y2="${y(min)}" class="marke"/><text x="178" y="${y(min) + 5}" class="markentext">min ${zahl(min, 0)}°</text>
      <line x1="48" x2="172" y1="${y(max)}" y2="${y(max)}" class="marke"/><text x="178" y="${y(max) + 5}" class="markentext">max ${zahl(max, 0)}°</text>
      </svg>`;
    // Aus dem Netz nach Preis heizt der Heizstab nur mit Temperaturfühler im Speicher (siehe heizstab.py).
    const netz = cfg.temp_sigura !== false, prag = cfg.prag_pret_ct ?? null, ore = this._preisliste().slice(0, 24);
    const boostBis = this._boostAktiv(), boost = !!boostBis;
    const bis = boost ? boostBis.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";
    return `${this._kopfModul(f, "heizstab", "Warmwasser", (p || 0) > 20 ? `Heizstab heizt mit ${kw(p)}` : "Heizstab aus")}
      <div class="raster-modul">
        <div class="karte mitte"><div class="tankreihe">${tank}<div class="tankwert"><b>${t == null ? "–" : `${zahl(t)}<small>°C</small>`}</b><span>${t == null ? "Temperatur unbekannt" : "im Speicher"}</span></div></div>
          ${cfg.temp_sigura === false ? '<small class="hilfe">Im Speicher ist noch kein Temperaturfühler gewählt.</small>' : ""}${cfg.legionella_letzt ? `<small class="hilfe">Legionellenschutz zuletzt: ${esc(cfg.legionella_letzt)}</small>` : ""}</div>
        <div class="karte einstellungen">
          ${cfg.boost_moeglich === false ? "" : this._feld("Warmes Wasser sofort", `<button class="gross ${boost ? "an" : ""}" data-akt="boost" style="--f:${f}">${boost ? `Heizt bis ${bis} · Stopp` : "Jetzt 1 Stunde heizen"}</button>`,
            "Auch aus dem Netz, wenn keine Sonne da ist. Danach übernimmt VOLTHERM wieder.")}
          <div class="zwei">${this._feld("Mindesttemperatur", this._stepper("heizstab.temp_min", min, "°C", 1, 35, 60))}
            ${this._feld("Mit Sonnenstrom bis", this._stepper("heizstab.temp_max", max, "°C", 1, 50, 80))}</div>
          ${netz ? `${this._feld("Bei günstigem Strom aus dem Netz heizen", this._wahl("heizstab.prag_pret_ct", prag != null ? prag : "null", [[prag != null ? prag : 15, "Ja"], ["null", "Nein"]], f))}
            ${prag != null ? this._feld("Nur bis max.", this._regler("heizstab.prag_pret_ct", prag, 5, 40, 1, "ct", f), `Dann heizt der Heizstab bis ${zahl(max, 0)} °C, auch ohne Sonne.`) : ""}` : ""}
        </div>
        ${netz ? `<div class="karte breit" style="--f:${f}"><div class="kopf"><span class="etikett">Strompreis · nächste 24 Stunden</span>
          <span class="mini"><b class="lg geplant" style="background:${f}"></b>günstig genug <b class="lg jetzt"></b>jetzt</span></div>
          ${prag != null ? this._balken(ore, (x, i) => (x.pret <= prag / 100 ? "geplant" : i === 0 ? "jetzt" : ""), prag / 100) : this._balken(ore, (x, i) => (i === 0 ? "jetzt" : ""))}
          <p class="planzeile">${this._hzPlanzeile(ore, prag, max, t)}</p></div>` : ""}
        ${this._warum(f, MOD_HEIZSTAB[dec.mod] || dec.mod, dec.motiv)}
      </div>`;
  }

  _hzPlanzeile(ore, prag, max, t) {
    if (prag == null) return "Warmwasser nur mit Sonnenstrom und wenn der Speicher unter die Mindesttemperatur fällt.";
    if (!ore.length) return "Noch keine Strompreise.";
    const guenstig = ore.filter((x) => x.pret <= prag / 100);
    if (!guenstig.length) return `In den nächsten 24 Stunden kostet der Strom immer mehr als ${zahl(prag, 0)} ct: Warmwasser nur mit Sonnenstrom.`;
    if (t != null && t >= max) return `Der Speicher hat schon ${zahl(t)} °C. In ${guenstig.length} günstigen Stunden würde ich bis ${zahl(max, 0)} °C nachheizen.`;
    const stunden = guenstig.map((x) => x.ora.slice(11, 13)).join(", ");
    return `In ${guenstig.length} ${guenstig.length === 1 ? "Stunde" : "Stunden"} kostet der Strom höchstens ${zahl(prag, 0)} ct (${stunden} Uhr). Dann heize ich bis ${zahl(max, 0)} °C, auch ohne Sonne.`;
  }

  // ---------- Klima ----------
  _seiteKlima() {
    const kl = this._s("vt_clima_decizie")?.attributes || {};
    const camere = this._cfg.clima?.camere || {};
    const winter = (kl.temp_ext ?? 10) < 15, f = C.klima;
    const karten = (kl.camere || []).map((r) => {
      const ent = this._s(r.entitate), st = ent?.attributes || {}, c = camere[r.entitate] || {}, pf = `clima.camere.${r.entitate}`;
      const zielKey = winter ? "confort_iarna" : "confort_vara", ziel = c[zielKey] ?? (winter ? 21 : 25);
      const hvac = ent?.state || "off", an = !["off", "unavailable", "unknown"].includes(hvac);
      return `<div class="karte raum" style="--z:${an ? (hvac === "cool" ? "#4D8DFF" : C.heizstab) : "var(--linie)"}">
        <div class="kopf"><b class="raumname">${esc(r.nume || st.friendly_name || "Klima")}</b><span class="pille ${an ? "an" : ""}">${HVAC[hvac] || esc(hvac)}</span></div>
        <div class="raumtemp"><b>${(r.temp_camera ?? st.current_temperature) == null ? "–" : `${zahl(r.temp_camera ?? st.current_temperature)}°`}</b><span>jetzt im Raum</span></div>
        ${this._feld(`Wunschtemperatur (${winter ? "Winter" : "Sommer"})`, this._stepper(`${pf}.${zielKey}`, ziel, "°C", 0.5, 16, 30, 1))}
        ${this._wahl(`${pf}.mod`, c.mod || "auto", [["auto", "Auto"], ["confort", "Komfort"], ["manual", "Selbst"]], f)}
        ${r.decizie ? `<p class="raumwarum">${esc(r.decizie.motiv)}</p>` : ""}
      </div>`;
    }).join("");
    return `${this._kopfModul(f, "klima", "Klima", `Draußen ${kl.temp_ext == null ? "–" : `${zahl(kl.temp_ext)} °C`} · ${winter ? "Heizsaison" : "Kühlsaison"}`)}
      <div class="raster-raeume">${karten}</div>
      <p class="fuss"><b>Auto:</b> nutzt Sonnenstrom zum Vorheizen oder Vorkühlen und pausiert bei teurem Strom. <b>Komfort:</b> hält die Wunschtemperatur, egal was der Strom kostet. <b>Selbst:</b> nur Fernbedienung, VOLTHERM greift nicht ein. Nach der Fernbedienung wartet VOLTHERM 2 Stunden.</p>`;
  }

  // ---------- Wärmepumpe ----------
  _seiteWp() {
    const a = this._s("vt_pompa_decizie")?.attributes || {}, stufe = this._n("vt_pompa_decizie"), cfg = this._cfg.pompa || {};
    const f = C.wp, sperreMin = (cfg.blocare_max_h ?? 2) * 60;
    const p14a = cfg.semnal_14a ? this._s(cfg.semnal_14a)?.state === "on" : null;
    const leiter = SG.map(([n, t, txt]) => `<div class="stufe ${n === stufe ? "aktiv" : ""}" style="--f:${n === 1 ? C.netz_bezug : n === 4 ? C.pv : f}">
      <span class="nr">${n}</span><b>${t}</b><small>${txt}</small></div>`).join("");
    const sonne = cfg.surplus_recomandat != null, pause = cfg.blocare_ct != null;
    return `${this._kopfModul(f, "wp", "Wärmepumpe", `SG-Ready · ${a.putere != null ? `nimmt ${kw(a.putere)}` : "Leistung unbekannt"}`)}
      <div class="raster-modul">
        <div class="karte"><div class="kopf"><span class="etikett">Betriebsart jetzt</span></div><div class="leiter">${leiter}</div>
          ${p14a == null ? "" : `<p class="p14a"><i style="background:${p14a ? C.netz_bezug : C.netz_einsp}"></i>${p14a ? "Der Netzbetreiber drosselt (§14a). VOLTHERM greift nicht ein." : "Keine Drosselung durch den Netzbetreiber (§14a)."}</p>`}</div>
        <div class="karte einstellungen">
          ${this._feld("Sonnenstrom nutzen", this._wahl("pompa.surplus_recomandat", sonne ? cfg.surplus_recomandat : "null", [[sonne ? cfg.surplus_recomandat : 1500, "Ja"], ["null", "Nein"]], f),
            "Bei Überschuss heizt die Wärmepumpe etwas wärmer und speichert die Sonne als Wärme.")}
          ${this._feld("Bei teurem Strom pausieren", this._wahl("pompa.blocare_ct", pause ? cfg.blocare_ct : "null", [[pause ? cfg.blocare_ct : 40, "Ja"], ["null", "Nein"]], f))}
          ${pause ? this._feld("Pause ab", this._regler("pompa.blocare_ct", cfg.blocare_ct, 25, 60, 1, "ct", f)) : ""}
          ${pause ? this._feld("Höchstens pro Tag", this._stepper("pompa.blocare_max_h", cfg.blocare_max_h ?? 2, "h", 0.5, 0.5, 4, 1),
            `Heute ${a.blocat_azi_min ?? 0} von ${sperreMin} min genutzt.`) : ""}
        </div>
        ${this._warum(f, a.titlu, a.motiv)}
      </div>`;
  }

  // ---------- Bilanz (Tag / Woche / Monat / Jahr) ----------
  async _bzLaden() {
    const { zeit, datum } = this._bz;
    try {
      this._bz.daten = this._extern ? window.VOLTHERM_BILANZ?.(zeit, datum, this._cfg.bilant) : await this._hass.callWS({ type: "voltherm/bilanz", zeit, datum });
      this._bz.fehler = null;
    } catch (err) {
      this._bz.fehler = err.message || "Bilanz nicht verfügbar.";
    }
    this._bz.tip = null;
    if (Date.now() > (this._ruhe || 0)) this._render();
  }

  _bzSchieben(r) {
    const d = new Date(`${this._bz.datum}T12:00:00`), z = this._bz.zeit;
    if (z === "tag") d.setDate(d.getDate() + r);
    else if (z === "woche") d.setDate(d.getDate() + 7 * r);
    else if (z === "monat") { d.setDate(1); d.setMonth(d.getMonth() + r); }
    else { d.setDate(1); d.setFullYear(d.getFullYear() + r); }
    this._bz.datum = isoTag(d);
    this._bzLaden();
  }

  _bzTitel(p) {
    const s = new Date(`${p.start}T12:00:00`), e = new Date(`${p.end}T12:00:00`);
    if (p.zeit === "tag") return s.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
    if (p.zeit === "woche") return `${s.getDate()}.${s.getMonth() + 1}. – ${e.getDate()}.${e.getMonth() + 1}.${e.getFullYear()}`;
    if (p.zeit === "monat") return `${MONATE[s.getMonth()]} ${s.getFullYear()}`;
    return String(s.getFullYear());
  }

  _bzName(p, t, lang = false) {
    if (p.zeit === "tag") return lang ? `${t.name}:00 Uhr` : t.name;
    if (p.zeit === "jahr") return lang ? MONATE[Number(t.name) - 1] : MONATE[Number(t.name) - 1].slice(0, 3);
    const d = new Date(`${t.name}T12:00:00`);
    if (p.zeit === "woche") return lang ? d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "numeric" }) : WOCHENTAG[(d.getDay() + 6) % 7];
    return lang ? d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "long" }) : String(d.getDate());
  }

  _bzDiagramm(p) {
    const teile = p.teile || [], n = teile.length;
    const ohne = (t) => t.ohne_solar ?? t.ohne_pv ?? 0, bez = (t) => t.bezahlt ?? t.kosten ?? 0;
    if (!n || !teile.some((t) => ohne(t) || bez(t) || t.erloes)) return `<div class="leerhinweis">Für diesen Zeitraum gibt es noch keine Daten. VOLTHERM zählt ab dem Tag der Einrichtung.</div>`;
    const W = 1000, T = 14, unten = 220, L = 54, R = 8;
    const maxV = Math.max(...teile.map((t) => Math.max(ohne(t), bez(t))), 0.01) * 1.1;
    const maxE = Math.max(...teile.map((t) => t.erloes || 0), 0.01);
    const y = (v) => unten - ((unten - T) * v) / maxV, eh = (v) => (34 * v) / maxE;
    const breite = (W - L - R) / n, bw = Math.max(4, breite * 0.64);
    const ticks = [0, maxV / 3, (2 * maxV) / 3].map((v) => `<line class="gitter" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" class="achse rechtsb">${zahl(v, v < 10 ? 1 : 0)} €</text>`).join("");
    const jede = n > 24 ? 3 : n > 12 ? 2 : 1;
    const saeulen = teile.map((t, i) => {
      const x = L + i * breite + (breite - bw) / 2, aktiv = this._bz.tip === i;
      return `<g data-akt="bztip|${i}" class="bzsaeule${aktiv ? " aktiv" : ""}">
        <rect x="${L + i * breite}" y="${T}" width="${breite}" height="${unten + 50 - T}" fill="transparent"/>
        <rect x="${x}" y="${y(ohne(t))}" width="${bw}" height="${unten - y(ohne(t))}" rx="3" fill="#343a46"/>
        <rect x="${x + bw * 0.18}" y="${y(bez(t))}" width="${bw * 0.64}" height="${unten - y(bez(t))}" rx="2" fill="${C.netz_bezug}"/>
        ${t.erloes ? `<rect x="${x + bw * 0.18}" y="${unten + 2}" width="${bw * 0.64}" height="${eh(t.erloes)}" rx="2" fill="${C.netz_einsp}" opacity=".85"/>` : ""}
        ${i % jede === 0 ? `<text x="${x + bw / 2}" y="${unten + 52}" class="achse">${this._bzName(p, t)}</text>` : ""}</g>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${unten + 58}" class="bzdiagramm" role="img" aria-label="Stromkosten je Zeitabschnitt">${ticks}<line class="gitter" x1="${L}" x2="${W - R}" y1="${unten}" y2="${unten}"/>${saeulen}</svg>`;
  }

  _seiteBilanz() {
    const p = this._bz.daten, z = this._bz.zeit, g = C.netz_einsp;
    const kopf = `<div class="bzkopf">${this._kopfModul(g, "bilanz", "Bilanz", p ? this._bzTitel(p) : "")}
      <div class="bzsteuer"><div class="wahl bzzeit" role="group" style="--f:#19C3E6">${[["tag", "Tag"], ["woche", "Woche"], ["monat", "Monat"], ["jahr", "Jahr"]].map(([w, t]) => `<button data-akt="bzzeit|${w}" aria-pressed="${z === w}">${t}</button>`).join("")}</div>
        <div class="blaettern"><button data-akt="bzweiter|-1" aria-label="früher" ${p && !p.frueher ? "disabled" : ""}>‹</button><button data-akt="bzweiter|1" aria-label="später" ${p && !p.spaeter ? "disabled" : ""}>›</button></div></div></div>`;
    if (!p) return `${kopf}<div class="leerhinweis">${esc(this._bz.fehler || "Lade …")}</div>`;
    const s = p.summe || {}, cfg = this._cfg.bilant || {};
    const verg = cfg.verguetung_ct ?? p.verguetung_ct, grund = cfg.grundgebuehr ?? p.grundgebuehr;
    const kpis = [["Gespart", eur(s.ersparnis), "gegenüber ohne Solaranlage", g, "haupt"], ["Bezahlt", eur(s.bezahlt), grund ? "Netzstrom + Grundgebühr" : "Netzstrom", C.netz_bezug],
      ["Ohne Solaranlage", eur(s.ohne_solar), "gleicher Verbrauch, alles aus dem Netz", "var(--mut)"],
      ["Einspeisung", eur(s.erloes), `${kwhT(s.einspeisung)} ins Netz`, g], ["Autarkie", s.autarkie == null ? "–" : `${s.autarkie} %`, "vom Verbrauch selbst erzeugt", C.pv]];
    const tipT = this._bz.tip != null ? p.teile?.[this._bz.tip] : null;
    const tip = tipT ? `<b>${esc(this._bzName(p, tipT, true))}</b> · bezahlt <b>${eur(tipT.bezahlt ?? tipT.kosten)}</b> · ohne Solaranlage ${eur(tipT.ohne_solar ?? tipT.ohne_pv)} · Einspeisung ${eur(tipT.erloes)}`
      : "Tippen Sie auf einen Balken für Details.";
    const proKwh = s.verbraucht > 0.1 ? `${zahl((s.netto / s.verbraucht) * 100, 1)} ct je verbrauchter kWh` : "";
    const rechnung = `<div class="zeilen">
        <div><span>Netzstrom (${kwhT(s.bezug)})</span><b>${eur(s.kosten)}</b></div>
        ${grund ? `<div><span>Grundgebühr</span><b>${eur(s.grund)}</b></div>` : ""}
        <div><span>Abzüglich Einspeisevergütung</span><b style="color:${g}">− ${eur(s.erloes)}</b></div>
        <div class="summe"><span><b>Unterm Strich</b></span><b class="gross-zahl">${eur(s.netto)}</b></div></div>
      <p class="bzschnitt">${s.tage > 1 ? `Durchschnitt <b>${eur(s.netto / s.tage)}</b> pro Tag` : ""}${s.tage > 1 && proKwh ? " · " : ""}${proKwh}</p>
      <div class="zwei bzsatz">
        ${this._feld("Einspeisevergütung", this._stepper("bilant.verguetung_ct", verg, "ct/kWh", 0.1, 0, 50, 1))}
        ${this._feld("Grundgebühr", this._stepper("bilant.grundgebuehr", grund, "€/Monat", 0.5, 0, 100, 2))}</div>`;
    const andere = (s.wallbox || 0) + (s.pompa || 0) + (s.heizstab || 0);
    const verbr = [["Haus", Math.max(0, (s.verbraucht || 0) - andere), C.haus], ["Wallbox", s.wallbox, C.wallbox], ["Wärmepumpe", s.pompa, C.wp], ["Warmwasser", s.heizstab, C.heizstab]].filter((v) => (v[1] || 0) > 0.05);
    const vmax = Math.max(...verbr.map((v) => v[1]), 0.01), jeKwh = s.verbraucht > 0.1 ? (s.bezahlt || 0) / s.verbraucht : 0;
    const verbraucher = verbr.length ? verbr.map(([t, k, f]) => `<div class="vz" style="--f:${f}"><span>${t}</span><div class="spur2"><i style="width:${(k / vmax) * 100}%"></i></div><em>${kwhT(k)} · ${eur(k * jeKwh)}</em></div>`).join("") : '<div class="leerhinweis">Noch keine Daten.</div>';
    const energie = `<div class="zeilen">
        <div><span>Erzeugt (Photovoltaik)</span><b style="color:${C.pv}">${kwhT(s.erzeugt)}</b></div>
        <div><span>Verbraucht</span><b>${kwhT(s.verbraucht)}</b></div>
        <div><span>Aus dem Netz</span><b style="color:${C.netz_bezug}">${kwhT(s.bezug)}</b></div>
        <div><span>Ins Netz eingespeist</span><b style="color:${g}">${kwhT(s.einspeisung)}</b></div>
        <div class="summe"><span>Eigenverbrauch der Sonnenenergie</span><b>${s.eigenverbrauch == null ? "–" : `${s.eigenverbrauch} %`}</b></div>
        <div><span>CO₂ vermieden</span><b>${zahl(s.co2_kg || 0, 0)} kg</b></div></div>`;
    const taten = [];
    if (s.wallbox > 0.5) taten.push([C.wallbox, kwhT(s.wallbox), `Das Auto ${s.wb_tage > 1 ? `an ${s.wb_tage} Tagen ` : ""}geladen, davon ${Math.round((100 * (s.wb_sonne || 0)) / s.wallbox)} % mit eigenem Strom.`]);
    if (s.bat_entladen > 0.5) taten.push([C.batterie, eur(s.bat_wert), `Der Speicher hat ${kwhT(s.bat_entladen)} Netzstrom ersetzt.`]);
    if (s.hz_sonne > 0.5) taten.push([C.heizstab, kwhT(s.hz_sonne), `Warmwasser mit Sonnenstrom statt Einspeisung${verg ? ` für ${zahl(verg, 1)} ct` : ""}.`]);
    taten.push([g, eur(s.ersparnis), "Insgesamt gespart in diesem Zeitraum."]);
    return `${kopf}
      <div class="bzseite">
        <section class="bzkpis">${kpis.map(([t, v, u, f, k]) => `<div class="karte kpi ${k || ""}" style="--f:${f}"><span>${t}</span><b>${v}</b><span>${u}</span></div>`).join("")}</section>
        <div class="bzraster">
          <section class="karte"><div class="kopf"><span class="etikett">${z === "tag" ? "Stromkosten je Stunde" : z === "jahr" ? "Stromkosten je Monat" : "Stromkosten je Tag"}</span>
            <span class="mini"><i class="lg" style="background:#343a46"></i>ohne Solaranlage<i class="lg" style="background:${C.netz_bezug}"></i>bezahlt<i class="lg" style="background:${g}"></i>Einspeisung</span></div>
            ${this._bzDiagramm(p)}<div class="bztip">${tip}</div></section>
          <section class="karte"><div class="kopf"><span class="etikett">Ihre Stromrechnung</span></div>${rechnung}</section>
        </div>
        <div class="bzraster">
          <section class="karte"><div class="kopf"><span class="etikett">Wofür der Strom gebraucht wurde</span><span class="mini">kWh · anteilige Kosten</span></div><div class="verbraucher">${verbraucher}</div></section>
          <section class="karte"><div class="kopf"><span class="etikett">Energie</span></div>${energie}</section>
        </div>
        <section class="karte"><div class="kopf"><span class="etikett">Was VOLTHERM für Sie getan hat</span></div>
          <div class="taten">${taten.map(([f, v, t]) => `<div class="tat" style="--f:${f}"><b>${v}</b><span>${t}</span></div>`).join("")}</div></section>
        ${this._praesKarte()}
        ${this._fernKarte()}
      </div>`;
  }

  _render() {
    if (!this._hass || this._praes) return;  // prezentarea e deschisă: nu redesenăm, altfel iframe-ul ar porni de la capăt
    const seiten = this._seiten();
    if (!seiten.some(([id]) => id === this._seite)) this._seite = seiten[0][0];
    const preis = this._n("vt_pret_curent");
    const jetzt = new Date();
    const inhalt = { energie: () => this._seiteEnergie(), pv: () => this._seitePv(), batterie: () => this._seiteBatterie(),
      wallbox: () => this._seiteWallbox(), heizstab: () => this._seiteHeizstab(), klima: () => this._seiteKlima(), wp: () => this._seiteWp(),
      bilanz: () => this._seiteBilanz() }[this._seite]();
    const handy = istHandy();
    const haupt = this._handyHaupt(seiten);
    const navSeiten = handy ? seiten.filter(([id]) => haupt.includes(id)) : seiten;
    const mehr = handy ? seiten.filter(([id]) => !haupt.includes(id)) : [];
    const sich = this._sicherheit();
    const pauseKnopf = sich && sich.stare !== "pausiert" && !this._pauseFrage
      ? `<button class="pauseknopf" data-akt="pause|frage" title="Alle Geräte normal laufen lassen">${ico("pause", "currentColor", 16)}<span>Pausieren</span></button>` : "";
    const alt = this.shadowRoot.querySelector("main");
    const scroll = alt?.dataset.seite === this._seite ? alt.scrollTop : 0;
    this.shadowRoot.innerHTML = `<style>${CSS}</style>
      <div class="seite">
        <header>
          ${this._schmal ? `<button class="menue" data-akt="menue" aria-label="Menü">☰</button>` : ""}
          ${this._fehler ? `<span class="fehlerzeile">${esc(this._fehler)}</span>` : ""}
          <div class="marke"><svg viewBox="0 0 300 300" class="logo" aria-hidden="true"><polygon points="22,20 86,20 166,232 150,272" fill="#8FA3C8"/><polygon points="74,20 112,20 168,200 154,226" fill="#FFFFFF"/><polygon points="200,20 290,20 214,118 276,118 126,286 176,170 128,170" fill="#19C3E6"/></svg>
            <span>VOLT<b>HERM</b></span></div>
          <div class="datum">${jetzt.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })}</div>
          <div class="rechts">
            ${preis != null ? `<span class="preis"><small>Preis jetzt</small>${zahl(preis * 100)} ct</span>` : ""}
            ${pauseKnopf}
            <span class="uhr">${jetzt.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}</span></div>
        </header>
        <main data-seite="${this._seite}">${inhalt}</main>
        ${this._sicherHtml()}
        ${this._updateHtml()}
        ${handy ? this._mehrHtml(seiten) : ""}
        <nav aria-label="Bereiche">${navSeiten.map(([id, t, f]) => `<button data-akt="seite|${id}" aria-current="${id === this._seite}" style="--f:${f}">${ico(id, "currentColor", 22)}<span>${t}</span></button>`).join("")}
          ${handy ? (mehr.length ? `<button data-akt="mehr" aria-expanded="${!!this._mehr}" aria-current="${mehr.some(([id]) => id === this._seite)}" style="--f:#19C3E6">${ico("mehr", "currentColor", 22)}<span>Mehr</span></button>` : "")
          : `<button class="rund" data-akt="rundlauf" aria-pressed="${this._rundlauf}" title="Seiten automatisch wechseln, z. B. am Fernseher">${ico("rund", "currentColor", 22)}<span>${this._rundlauf ? "Rundlauf an" : "Rundlauf"}</span></button>`}</nav>
        ${this._rundlauf && !handy ? `<div class="rundbalken" style="--d:${RUNDLAUF_S}s" aria-hidden="true"><i></i></div>` : ""}
        ${this._ansageHtml()}
        ${this._hinweisHtml()}
      </div>`;
    const m = this.shadowRoot.querySelector("main");
    if (m) m.scrollTop = scroll;
    this._szeneEinpassen();
  }
}
